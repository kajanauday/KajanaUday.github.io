<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090a0f">
  <title>Kajana Uday Expenses | Sign in</title>
  <script>
    // Same theme as the app (dark by default), applied before anything paints.
    try { if (localStorage.getItem('family-budget-theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (error) { /* Dark by default. */ }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
  <style>
    /* The app's obsidian-and-gold palette, with its ivory-and-gold light theme. Text is at least 4.5:1 in both. */
    :root {
      color-scheme: dark;
      --canvas: #090a0f;
      --surface: #12141c;
      --surface-soft: #1a1d28;
      --ink: #f3efe6;
      --muted: #9ca1b3;
      --line: #262a38;
      --brand: #d4af37;
      --brand-text: #e3c25a;
      --on-brand: #1a1405;
      --expense: #ff8f80;
      --gold-gradient: linear-gradient(100deg, #b8862e 0%, #d4af37 35%, #e3c25a 52%, #c9993d 72%, #a8781f 100%);
      --gold-text: var(--gold-gradient);
      --focus: rgba(212, 175, 55, .6);
      --page-bg: radial-gradient(900px 560px at 15% -10%, rgba(59, 130, 246, .12), transparent 62%), radial-gradient(800px 520px at 105% 10%, rgba(249, 115, 22, .09), transparent 60%), radial-gradient(800px 500px at 50% 115%, rgba(212, 175, 55, .08), transparent 62%), var(--canvas);
      --card-sheen: rgba(255, 255, 255, .05);
      --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 24px 60px -20px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(255, 255, 255, .07);
      --mono: "DM Mono", monospace;
      --sans: "DM Sans", sans-serif;
      --display: "Manrope", sans-serif;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --canvas: #f6f3ec;
      --surface: #ffffff;
      --surface-soft: #efeadf;
      --ink: #1c1b18;
      --muted: #5c574d;
      --line: #e1dacb;
      --brand: #a67c16;
      --brand-text: #7e5d0c;
      --expense: #b3261e;
      --gold-text: linear-gradient(100deg, #5e430a 0%, #7a580d 35%, #86620f 52%, #7c5a0c 72%, #5e430a 100%);
      --focus: rgba(166, 124, 22, .55);
      --page-bg: radial-gradient(900px 560px at 15% -10%, rgba(59, 130, 246, .07), transparent 62%), radial-gradient(800px 520px at 105% 10%, rgba(249, 115, 22, .06), transparent 60%), radial-gradient(800px 500px at 50% 115%, rgba(212, 175, 55, .09), transparent 62%), var(--canvas);
      --card-sheen: rgba(255, 255, 255, .8);
      --shadow: 0 1px 2px rgba(60, 45, 20, .06), 0 24px 60px -24px rgba(60, 45, 20, .22), inset 0 1px 0 #fff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--page-bg); background-attachment: fixed; color: var(--ink); font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
    button, input { font: inherit; }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    [hidden] { display: none !important; }
    h1, p { margin-top: 0; }
    /* Nothing but the passkey: one field with its arrow, centred on the app's background. */
    .login-screen { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
    .passkey { width: min(340px, 100%); display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px; padding: 6px 6px 6px 18px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); transition: border-color .15s, box-shadow .15s; }
    .passkey:focus-within { border-color: var(--brand); box-shadow: var(--shadow), 0 0 0 3px var(--focus); }
    .passkey input { min-width: 0; height: 40px; padding: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font: 500 16px var(--mono); letter-spacing: .12em; }
    .passkey button { width: 40px; height: 40px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: var(--gold-gradient); color: var(--on-brand); cursor: pointer; font-size: 18px; transition: filter .15s, transform .15s; }
    .passkey button:hover { filter: brightness(1.08); }
    .passkey button:active { transform: scale(.94); }
    .passkey button:disabled { cursor: wait; }
    .passkey button:disabled i { animation: spin .8s linear infinite; }
    .passkey button:disabled i::before { content: "\f226"; }
    .passkey.is-wrong, .passkey.is-wrong:focus-within { border-color: var(--expense); box-shadow: var(--shadow), 0 0 0 3px color-mix(in srgb, var(--expense) 35%, transparent); animation: shake .32s ease; }
    .passkey input::selection { background: color-mix(in srgb, var(--brand) 35%, transparent); color: var(--ink); }
    @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    @media (prefers-reduced-motion: reduce) { .passkey.is-wrong { animation: none; } .passkey button:disabled i { animation: none; } }
  </style>
</head>
<body>
  <main id="login-screen" class="login-screen" hidden>
    <form id="login-form" class="passkey" novalidate>
      <input id="login-passkey" name="passkey" type="password" autocomplete="current-password" aria-label="Passkey" aria-describedby="login-error" autocapitalize="off" spellcheck="false" enterkeyhint="go">
      <button type="submit" aria-label="Sign in" title="Sign in"><i class="ti ti-arrow-right" aria-hidden="true"></i></button>
    </form>
    <p id="login-error" class="sr-only" role="alert"></p>
  </main>
  <script src="firebase-config.js?v=20261012a"></script>
  <script src="firebase-auth.js?v=20261021k"></script>
  <script>
    const STORAGE_KEY = 'family-budget-static-demo-v1';
    const LEDGER = 'family-budget/months.html';
    document.querySelector('#login-form').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const error = document.querySelector('#login-error');
      const button = form.querySelector('button[type="submit"]');
      const input = form.elements.passkey;
      if (!input.value.trim()) return input.focus();
      error.textContent = '';
      form.classList.remove('is-wrong');
      button.disabled = true;
      // The passkey signs in to Firebase Auth (firebase-auth.js); Firebase decides whether it is right and which role
      // its account has.
      let role;
      try {
        role = await FamilyAuth.signIn(new FormData(form).get('passkey'));
      } catch (failure) {
        button.disabled = false;
        // Wrong: the field shakes and turns red, and its text is selected to type again. The words are for screen readers.
        void form.offsetWidth;
        form.classList.add('is-wrong');
        input.select();
        error.textContent = {
          'not-recognized': 'That passkey was not recognized.',
          'too-many': 'Too many tries. Wait a few minutes and try again.',
          disabled: 'This sign-in has been turned off.'
        }[failure.code] || 'Could not reach Firebase. Check your connection and try again.';
        return;
      }
      if (role === 'viewer') sessionStorage.setItem(`${STORAGE_KEY}-viewer`, 'true');
      else sessionStorage.removeItem(`${STORAGE_KEY}-viewer`);
      sessionStorage.setItem(`${STORAGE_KEY}-signed-in`, 'true');
      sessionStorage.setItem(`${STORAGE_KEY}-passkey-signed-in`, 'true');
      sessionStorage.removeItem(`${STORAGE_KEY}-universe`);
      sessionStorage.removeItem(`${STORAGE_KEY}-open-months`);
      const today = new Date();
      sessionStorage.setItem(`${STORAGE_KEY}-month`, `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`);
      window.location.href = LEDGER;
    });
    // Already signed in on this device (or in this tab): straight to the ledger, without showing the field.
    (async () => {
      if (await FamilyAuth.restore()) return window.location.replace(LEDGER);
      document.querySelector('#login-screen').hidden = false;
      document.querySelector('#login-passkey').focus();
    })();
    document.querySelector('#login-passkey').addEventListener('input', () => document.querySelector('#login-form').classList.remove('is-wrong'));
  </script>
</body>
</html>
