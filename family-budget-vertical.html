<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f4">
  <title>Family Budget | Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
  <style>
    :root {
      color-scheme: light;
      --canvas: #f6f7f3;
      --surface: #fff;
      --surface-soft: #f3f5ef;
      --ink: #20271f;
      --muted: #777e75;
      --line: #e4e7df;
      --forest: #286347;
      --forest-dark: #204e39;
      --expense: #d75549;
      --mono: "DM Mono", monospace;
      --sans: "DM Sans", sans-serif;
      --display: "Manrope", sans-serif;
      --shadow: 0 1px 2px rgba(23, 36, 22, .04), 0 6px 18px rgba(23, 36, 22, .045);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--canvas); color: var(--ink); font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
    button, input { font: inherit; }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid #85b99b; outline-offset: 2px; }
    [hidden] { display: none !important; }
    h1, p { margin-top: 0; }
    .login-screen { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 80% 15%, #eaf1e6 0, transparent 33%), var(--canvas); }
    .login-box { width: min(400px, 100%); padding: 32px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
    .brand { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 26px; color: var(--ink); text-decoration: none; font: 800 17px var(--display); }
    .brand-mark { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 9px; background: var(--forest); color: white; font-size: 15px; }
    .brand-word span { color: var(--forest); }
    .eyebrow { margin: 0 0 8px; color: var(--forest); font: 500 10.5px var(--mono); letter-spacing: .07em; text-transform: uppercase; }
    .login-box h1 { margin: 0 0 8px; font: 700 25px var(--display); }
    .login-copy { margin-bottom: 22px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .login-form { display: grid; gap: 12px; }
    .field { display: grid; gap: 6px; color: var(--muted); font-size: 11.5px; font-weight: 600; }
    .field input { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font-size: 14px; }
    .login-error { min-height: 14px; margin: -4px 0 0; color: var(--expense); font-size: 11.5px; }
    .primary-button { min-height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 14px; border: 0; border-radius: 8px; background: var(--forest); color: white; cursor: pointer; font-size: 13px; font-weight: 700; }
    .primary-button:hover { background: var(--forest-dark); }
    .demo-hint { margin: 16px 0 0; padding: 10px; border-radius: 8px; background: var(--surface-soft); color: var(--muted); font-size: 11.5px; text-align: center; }
  </style>
</head>
<body>
  <div id="login-screen" class="login-screen" hidden>
    <section class="login-box" aria-labelledby="login-title">
      <span class="brand"><span class="brand-mark"><i class="ti ti-wallet" aria-hidden="true"></i></span><span class="brand-word">family<span>budget</span></span></span>
      <p class="eyebrow">Your household, at a glance</p>
      <h1 id="login-title">Welcome back.</h1>
      <p class="login-copy">Enter your passkey to see your family finances across India and Japan.</p>
      <form id="login-form" class="login-form">
        <label class="field" for="login-passkey">Passkey<input id="login-passkey" name="passkey" type="password" autocomplete="current-password" required></label>
        <p id="login-error" class="login-error" role="alert"></p>
        <button class="primary-button" type="submit">Continue <i class="ti ti-arrow-right" aria-hidden="true"></i></button>
      </form>
      <p class="demo-hint">Demo passkey · kajanauday</p>
    </section>
  </div>
  <script>
    const STORAGE_KEY = 'family-budget-static-demo-v1';
    const LEDGER = 'family-budget/months.html';
    document.querySelector('#login-form').addEventListener('submit', event => {
      event.preventDefault();
      if (new FormData(event.currentTarget).get('passkey') !== 'kajanauday') {
        document.querySelector('#login-error').textContent = 'That passkey was not recognized.';
        return;
      }
      sessionStorage.setItem(`${STORAGE_KEY}-signed-in`, 'true');
      sessionStorage.setItem(`${STORAGE_KEY}-passkey-signed-in`, 'true');
      sessionStorage.removeItem(`${STORAGE_KEY}-universe`);
      sessionStorage.removeItem(`${STORAGE_KEY}-open-months`);
      const today = new Date();
      sessionStorage.setItem(`${STORAGE_KEY}-month`, `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`);
      window.location.href = LEDGER;
    });
    const isSignedIn = sessionStorage.getItem(`${STORAGE_KEY}-signed-in`) === 'true';
    if (isSignedIn) window.location.replace(LEDGER);
    document.querySelector('#login-screen').hidden = isSignedIn;
  </script>
</body>
</html>
