<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Language Studio</title>
  <script>
    // Applied before first paint to avoid a light-mode flash on load.
    if (localStorage.getItem('theme') === 'dark' ||
        (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <style>
    :root {
      color-scheme: light;
      --panel: #ffffff;
      --panel-strong: #f8fafc;
      --border: #dbe4f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --accent-dark: #1e3a8a;
      --body-grad-1: #f8fbff;
      --body-grad-2: #eef4ff;
      --glass-bg: rgba(255, 255, 255, 0.92);
      --hairline: rgba(15, 23, 42, 0.07);
    }

    :root.dark {
      color-scheme: dark;
      --panel: #1e293b;
      --panel-strong: #0f172a;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-soft: #1e3a8a;
      --accent-dark: #93c5fd;
      --body-grad-1: #0f172a;
      --body-grad-2: #111c33;
      --glass-bg: rgba(15, 23, 42, 0.85);
      --hairline: rgba(226, 232, 240, 0.09);
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, var(--body-grad-1) 0%, var(--body-grad-2) 100%);
      color: var(--text);
      transition: background 0.2s ease, color 0.2s ease;
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .pill {
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 0.35rem 0.7rem;
      font-size: 0.8rem;
      background: var(--panel);
      color: var(--muted);
    }

    /* Word rows: no box, no shadow, no radius — just the faintest possible
       divider between entries, so a section reads as one continuous list.
       Deliberately much fainter than the section-to-section divider below
       (var(--border)) so the two levels never get visually confused. The
       word-list wrapper (not this class) carries the vertical rhythm; the
       last row in a list has no line under it (nothing to separate it from). */
    .word-list > .compact-card + .compact-card {
      border-top: 1px solid var(--hairline);
    }

    .compact-card {
      padding: 0.4rem 0.1rem;
      background: transparent;
    }

    .compact-card:hover {
      background: var(--panel-strong);
    }

    .meaning-inline {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      align-items: center;
      font-size: 0.75rem;
      color: #475569;
    }

    .draft-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.7rem;
      background: linear-gradient(135deg, #eff6ff 0%, #f8fbff 100%);
      border-color: #bfdbfe;
    }

    .modal-backdrop {
      display: none;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .section-row + .section-row {
      margin-top: 0.6rem;
      padding-top: 0.6rem;
      border-top: 1px solid var(--border);
    }

    /* .section-actions is a sibling of <details> itself, positioned relative
       to this wrapper — NOT a descendant of <details> at all (not even a
       sibling of <summary> inside it). Chromium refuses to render or
       hit-test any non-summary child of a closed <details>, and that isn't
       something CSS can override (display/content-visibility overrides had
       no effect in practice — the geometry gets reported but nothing paints
       or receives clicks). A true sibling of <details> is unaffected. */
    .section-row {
      position: relative;
    }

    .section-row-sub {
      margin-left: 1rem;
      padding-left: 0.6rem;
      border-left: 2px solid var(--border);
    }

    .section-group > summary {
      cursor: pointer;
      user-select: none;
      list-style: revert;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0.15rem 3.75rem 0.15rem 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
    }

    /* The section "+" add box mounts here, right after the label, so typing a
       word feels like a continuation of the header line rather than a new
       control — no border/background of its own, just inherits the row. The
       preview/clear panel floats below it instead, so it never disturbs the
       header's height. Falls back to its own full-width line on narrow
       screens, where an inline box would crowd the label and action icons. */
    .section-add-widget {
      display: flex;
      position: relative;
      align-items: center;
      flex: 1 1 140px;
      min-width: 0;
      margin-left: 0.6rem;
    }

    .section-add-input {
      width: 100%;
      min-width: 0;
      border: none;
      background: transparent;
      outline: none;
      box-shadow: none;
      padding: 0;
      margin: 0;
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: normal;
      text-transform: none;
      color: var(--text);
      cursor: text;
    }

    .section-add-input::placeholder {
      color: var(--muted);
      text-transform: none;
    }

    .section-add-panel {
      position: absolute;
      left: 0;
      top: 100%;
      z-index: 20;
      margin-top: 0.3rem;
      width: 18rem;
      max-width: calc(100vw - 2rem);
      border-radius: 0.75rem;
      border: 1px solid var(--border);
      background: var(--panel);
      padding: 0.5rem;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: normal;
      text-transform: none;
      cursor: auto;
    }

    @media (max-width: 480px) {
      .section-add-widget {
        flex-basis: 100%;
        margin-left: 0;
        margin-top: 0.3rem;
      }
    }

    .section-group > summary::marker {
      font-size: 0.6rem;
    }

    .section-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .section-actions {
      position: absolute;
      top: 0.15rem;
      right: 0;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-shrink: 0;
    }

    .section-action-btn {
      font-size: inherit;
      font-weight: inherit;
      letter-spacing: normal;
      text-transform: none;
      line-height: 1;
      color: var(--muted);
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    .section-action-btn:hover {
      color: var(--accent);
    }

    .section-group .section-body {
      margin-top: 0.5rem;
    }
  </style>
</head>

      showHidden: false,

      sectionSummary: {},
      sectionSummaryRef: null,

      hiddenSections: {},
      hiddenSectionsRef: null,
