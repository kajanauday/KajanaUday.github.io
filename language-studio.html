    function getCurrentLanguageData() {
      return languageConfig[state.language] || languageConfig.japanese;
    }

    function normalize(text) {
      return (text || '').trim().toLowerCase();
    }

    function escapeHtml(text) {
      return String(text || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function translateText(text, sourceLang, targetLang) {
      if (!text || sourceLang === targetLang) return '';
      try {
        // Google's free client-side translation endpoint — real machine
        // translation (no API key), unlike MyMemory's crowd-sourced lookup
        // which returns bad matches for short/casual words like "Hi".
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
        const response = await fetch(url);
        const data = await response.json();
        const segments = data && data[0];
        if (!Array.isArray(segments)) return '';
        return segments.map(segment => segment[0] || '').join('').trim();
      } catch (err) {
        console.error('Auto-translation failed', err);
        return '';
      }
    }

    function transliterateJapaneseToRomaji(text) {
      if (!text) return '';

      const singleKanaMap = {
        'あ': 'a', 'い': 'i', 'う': 'u', 'え': 'e', 'お': 'o',
        'か': 'ka', 'き': 'ki', 'く': 'ku', 'け': 'ke', 'こ': 'ko',
        'さ': 'sa', 'し': 'shi', 'す': 'su', 'せ': 'se', 'そ': 'so',
        'た': 'ta', 'ち': 'chi', 'つ': 'tsu', 'て': 'te', 'と': 'to',
        'な': 'na', 'に': 'ni', 'ぬ': 'nu', 'ね': 'ne', 'の': 'no',
        'は': 'ha', 'ひ': 'hi', 'ふ': 'fu', 'へ': 'he', 'ほ': 'ho',
        'ま': 'ma', 'み': 'mi', 'む': 'mu', 'め': 'me', 'も': 'mo',
        'や': 'ya', 'ゆ': 'yu', 'よ': 'yo',
        'ら': 'ra', 'り': 'ri', 'る': 'ru', 'れ': 're', 'ろ': 'ro',
        'わ': 'wa', 'を': 'wo', 'ん': 'n',
        'が': 'ga', 'ぎ': 'gi', 'ぐ': 'gu', 'げ': 'ge', 'ご': 'go',
        'ざ': 'za', 'じ': 'ji', 'ず': 'zu', 'ぜ': 'ze', 'ぞ': 'zo',
        'だ': 'da', 'ぢ': 'ji', 'づ': 'zu', 'で': 'de', 'ど': 'do',
        'ば': 'ba', 'び': 'bi', 'ぶ': 'bu', 'べ': 'be', 'ぼ': 'bo',
        'ぱ': 'pa', 'ぴ': 'pi', 'ぷ': 'pu', 'ぺ': 'pe', 'ぽ': 'po',
        'ゃ': 'ya', 'ゅ': 'yu', 'ょ': 'yo', 'っ': 'tsu'
      };

      const comboKanaMap = {
        'きゃ': 'kya', 'きゅ': 'kyu', 'きょ': 'kyo',
        'しゃ': 'sha', 'しゅ': 'shu', 'しょ': 'sho',
        'ちゃ': 'cha', 'ちゅ': 'chu', 'ちょ': 'cho',
        'にゃ': 'nya', 'にゅ': 'nyu', 'にょ': 'nyo',
        'ひゃ': 'hya', 'ひゅ': 'hyu', 'ひょ': 'hyo',
        'みゃ': 'mya', 'みゅ': 'myu', 'みょ': 'myo',
        'りゃ': 'rya', 'りゅ': 'ryu', 'りょ': 'ryo',
        'ぎゃ': 'gya', 'ぎゅ': 'gyu', 'ぎょ': 'gyo',
        'じゃ': 'ja', 'じゅ': 'ju', 'じょ': 'jo',
        'びゃ': 'bya', 'びゅ': 'byu', 'びょ': 'byo',
        'ぴゃ': 'pya', 'ぴゅ': 'pyu', 'ぴょ': 'pyo',
        'だ': 'da'
      };

      // A plain vowel kana right after a syllable ending in the same vowel (or う
      // after an お-ending syllable) lengthens it — write that as a macron rather
      // than doubling the letter, e.g. どう -> "dō" not "dou".
      const plainVowelMap = {
        'あ': 'a', 'い': 'i', 'う': 'u', 'え': 'e', 'お': 'o',
        'ア': 'a', 'イ': 'i', 'ウ': 'u', 'エ': 'e', 'オ': 'o'
      };
      const macronMap = { a: 'ā', i: 'ī', u: 'ū', e: 'ē', o: 'ō' };

      const normalized = String(text)
        .replace(/\s+/g, '')
        .replace(/（/g, '(')
        .replace(/）/g, ')');

      const syllables = [];
      let index = 0;

      while (index < normalized.length) {
        const char = normalized[index];
        const next = normalized[index + 1];

        if (!char) break;
        if (char === 'ー') {
          const previous = syllables[syllables.length - 1];
          const lastVowel = previous ? previous.slice(-1) : '';
          if (previous && macronMap[lastVowel]) {
            syllables[syllables.length - 1] = previous.slice(0, -1) + macronMap[lastVowel];
          }
          index += 1;
          continue;
        }

        if (char === 'っ') {
          const nextKana = next && (comboKanaMap[next] || singleKanaMap[next] || next);
          if (nextKana) {
            // Push just the doubling consonant — the next character's own syllable
            // (processed on the following loop iteration) supplies the second copy.
            syllables.push(nextKana[0]);
          }
          index += 1;
          continue;
        }

        if (plainVowelMap[char]) {
          const vowel = plainVowelMap[char];
          const previous = syllables[syllables.length - 1];
          const lastVowel = previous ? previous.slice(-1) : '';
          const isLongVowel = previous && (lastVowel === vowel || (vowel === 'u' && lastVowel === 'o'));
          if (isLongVowel) {
            syllables[syllables.length - 1] = previous.slice(0, -1) + macronMap[lastVowel];
            index += 1;
            continue;
          }
        }

        const katakana = char && char.charCodeAt(0) >= 0x30A0 && char.charCodeAt(0) <= 0x30FF;
        const hiragana = char && char.charCodeAt(0) >= 0x3040 && char.charCodeAt(0) <= 0x309F;

        if (katakana) {
          const hiraganaChar = String.fromCharCode(char.charCodeAt(0) - 0x60);
          const combo = comboKanaMap[hiraganaChar + (next || '')] || comboKanaMap[hiraganaChar];
          if (combo) {
            syllables.push(combo);
            index += 2;
            continue;
          }
          const single = singleKanaMap[hiraganaChar];
          if (single) {
            syllables.push(single);
            index += 1;
            continue;
          }
        }

        if (hiragana) {
          const combo = comboKanaMap[char + (next || '')] || comboKanaMap[char];
          if (combo) {
            syllables.push(combo);
            index += 2;
            continue;
          }
          const single = singleKanaMap[char];
          if (single) {
            syllables.push(single);
            index += 1;
            continue;
          }
        }

        if (/[a-zA-Z]/.test(char)) {
          syllables.push(char.toLowerCase());
        }
        index += 1;
      }

      return syllables.join('');
    }

    async function getRomanization(text, sourceLang, targetLang) {
      if (!text || sourceLang === 'en') return '';
      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&dt=rm&q=${encodeURIComponent(text)}`;
        const response = await fetch(url);
        const data = await response.json();
        const segments = data && data[0];
        if (!Array.isArray(segments)) return '';
        // Romanization is appended as an extra segment shaped like [null, null, ...romanizedText].
        const romanEntry = segments.find(segment => segment[0] === null && segment[1] === null);
        if (!romanEntry) return '';
        const romanized = romanEntry.slice(2).find(value => typeof value === 'string' && value.trim());
        return romanized || '';
      } catch (err) {
        console.error('Romanization failed', err);
        return '';
      }
    }

    // Romanizes a native word for languages other than Japanese (which has its
    // own internal transliterator, tried first, for speed and to avoid a round
    // trip when there's no kanji involved).
    async function romanizeNativeWord(text, nativeLang) {
      if (nativeLang === 'en' || !text) return '';
      if (nativeLang === 'ja') {
        const containsKanji = /[一-鿿]/.test(text);
        if (!containsKanji) {
          const internal = transliterateJapaneseToRomaji(text);
          if (internal) return internal;
        }
      }
      return getRomanization(text, nativeLang, 'en');
    }

    // Decides which direction a quick-add entry is being typed in: plain latin
    // text is treated as the English meaning to translate into Japanese;
    // anything else is treated as the Japanese word itself.
    function detectQuickAddDirection(text) {
      const isAllLatin = /^[a-zA-Z\s'".,!?-]+$/.test((text || '').trim());
      return isAllLatin ? 'toNative' : 'toEnglish';
    }

    // Resolves a single typed string into {word, pronunciation, englishMeaning}
    // (Firebase's actual w/p/em fields), regardless of which direction it was
    // typed in — the direction only changes what's derived from what.
    async function resolveQuickAddFields(text) {
      const direction = detectQuickAddDirection(text);
      const nativeLang = langCodeMap[state.language] || 'ja';

      if (direction === 'toNative') {
        const englishMeaning = text;
        const word = (await translateText(text, 'en', nativeLang)) || text;
        const pronunciation = await romanizeNativeWord(word, nativeLang);
        return { direction, word, pronunciation, englishMeaning };
      }

      const word = text;
      const [pronunciation, englishMeaning] = await Promise.all([
        romanizeNativeWord(word, nativeLang),
        translateText(word, nativeLang, 'en')
      ]);
      return { direction, word, pronunciation, englishMeaning };
    }

    // Firebase shape: words/{language}/{section}/{id} -> { w, p, em, c }.
    // Flattens ONE section's snapshot into the entry list the rest of the app
    // works with — sections are always fetched individually, on demand, never
    // as a whole-language read (see ensureSectionLoaded).
    function flattenSectionSnapshot(language, section, snapshot) {
      const val = snapshot.val() || {};
      const entries = [];
      Object.entries(val).forEach(([id, data]) => {
        if (!data) return;
        entries.push({
          id,
          word: data.w || '',
          pronunciation: data.p || '',
          englishMeaning: data.em || '',
          language,
          section,
          createdAt: data.c || 0
        });
      });
      return entries.sort((a, b) => (Number(b.createdAt) || 0) - (Number(a.createdAt) || 0));
    }

    function normalizeSectionName(name) {
      return (name || '').trim().toUpperCase() || 'UNCATEGORIZED';
    }

    function sectionSort(a, b) {
      if (a === 'UNCATEGORIZED') return 1;
      if (b === 'UNCATEGORIZED') return -1;
      return a.localeCompare(b);
    }

    function getSortedSectionNames() {
      return Object.keys(state.sectionSummary).sort(sectionSort);
    }

    // Subsections are just ordinary sections whose Firebase key encodes a
    // parent via a '>' separator, e.g. "FOOD>DESSERTS" is a child of "FOOD" —
    // a single flat key (Firebase keys allow '>' fine), split apart only for
    // display/behavior. Only one level deep is rendered; a '>' typed while
    // already inside a subsection's own add-widget is rejected rather than
    // silently building a confusing multi-level key.
    function isSubsection(section) {
      return section.includes('>');
    }

    function getParentSectionName(section) {
      const idx = section.indexOf('>');
      return idx === -1 ? null : section.slice(0, idx);
    }

    function getSubsectionLabel(section) {
      const idx = section.indexOf('>');
      return idx === -1 ? section : section.slice(idx + 1);
    }

    // Top-level sections only — used everywhere subsections must be excluded
    // (the main list's own rows, and the quiz/reading "all sections" sweeps).
    function getTopLevelSectionNames() {
      return getSortedSectionNames().filter(section => !isSubsection(section));
    }

    function getSubsectionsOf(parentSection) {
      return getSortedSectionNames().filter(section => getParentSectionName(section) === parentSection);
    }

    // A section is visible on the very first load unless explicitly hidden —
    // presence in state.hiddenSections is the only thing that marks it hidden,
    // so nothing needs writing for the (default) enabled case. Only top-level
    // sections carry this flag; subsections always follow their parent.
    function isSectionHidden(section) {
      return !!state.hiddenSections[section];
    }

    async function toggleSectionHidden(section) {
      const nextHidden = !isSectionHidden(section);
      try {
        await database.ref(`hiddenSections/${state.language}/${section}`).set(nextHidden ? true : null);
      } catch (err) {
        console.error('Failed to toggle section visibility', err);
        window.alert('Failed to update section visibility. See console for details.');
      }
    }

    // On-screen label for a section — subsections show as "PARENT → CHILD" so
    // it's clear which parent they're nested under even out of context (e.g.
    // in the quiz/reading status line).
    function getSectionDisplayLabel(section) {
      return isSubsection(section) ? `${getParentSectionName(section)} → ${getSubsectionLabel(section)}` : section;
    }

    // Spoken form for reading mode's section announcement — just the child
    // name on its own reads far more naturally than repeating the full path.
    function getSectionSpokenLabel(section) {
      return isSubsection(section) ? getSubsectionLabel(section) : section;
    }

    // Expands each section into itself followed by its own subsections (never
    // recursing further) — this is what makes quizzing/reading a top-level
    // section, or the app-level "quiz/read everything" sweep, also cover
    // whatever's nested under it. A subsection passed in expands to itself
    // alone, since it has none of its own.
    function expandWithSubsections(sections) {
      const expanded = [];
      sections.forEach(section => {
        expanded.push(section);
        if (!isSubsection(section)) {
          getSubsectionsOf(section).forEach(sub => expanded.push(sub));
        }
      });
      return expanded;
    }

    // On-demand duplicate check when adding a brand-new word — a single direct
    // read of this language's words, done only at the moment "Add" is clicked
    // (not maintained as a standing index).
    async function wordExistsInLanguage(normalizedWord) {
      try {
        const snapshot = await wordsRef.child(state.language).once('value');
        const languageData = snapshot.val() || {};
        return Object.values(languageData).some(sectionWords =>
          Object.values(sectionWords || {}).some(data => data && normalize(data.w || '') === normalizedWord)
        );
      } catch (err) {
        console.error('Duplicate check failed', err);
        return false;
      }
    }

    // Atomically bumps a section's live count in sectionSummary — this is how the
    // header counts stay in sync with the actual data, without ever having to
    // re-read the whole language to recompute them.
    function bumpSectionCount(language, section, delta) {
      return database.ref(`sectionSummary/${language}/${section}`).transaction(current => {
        const next = (Number(current) || 0) + delta;
        return next > 0 ? next : null;
      });
    }

    // Runs at most once per language, ever (guarded by sectionSummary already
    // existing): folds any legacy mixed-case section keys into their upper-case
    // counterpart and (re)computes the section counts. This is the ONLY place
    // that reads a language's entire word tree — everything else fetches one
    // section at a time.
    async function bootstrapLanguageIfNeeded(language) {
      if (!state.isAdmin) return;
      try {
        const summarySnap = await database.ref(`sectionSummary/${language}`).once('value');
        if (summarySnap.exists()) return;

        const wordsSnap = await wordsRef.child(language).once('value');
        const raw = wordsSnap.val() || {};
        const updates = {};
        const summary = {};

        Object.entries(raw).forEach(([section, words]) => {
          const upper = normalizeSectionName(section);
          Object.entries(words || {}).forEach(([id, data]) => {
            if (!data) return;
            if (section !== upper) {
              updates[`words/${language}/${upper}/${id}`] = data;
              updates[`words/${language}/${section}/${id}`] = null;
            }
            summary[upper] = (summary[upper] || 0) + 1;
          });
        });

        updates[`sectionSummary/${language}`] = summary;
        await database.ref().update(updates);
      } catch (err) {
        console.error(`Failed to bootstrap language "${language}"`, err);
      }
    }

    // Fetches (once) and live-subscribes to a single section's words. Resolves
    // with whatever's cached already if this section was loaded before — the
    // listener set up on first load keeps that cache fresh from then on.
    function ensureSectionLoaded(section) {
      const language = state.language;
      if (state.sectionCache.has(section)) {
        return Promise.resolve(state.sectionCache.get(section));
      }
      return new Promise((resolve) => {
        const sectionRef = wordsRef.child(language).child(section);
        let resolved = false;
        sectionRef.on('value', (snapshot) => {
          const entries = flattenSectionSnapshot(language, section, snapshot);
          state.sectionCache.set(section, entries);
          renderSectionBodyIfPresent(section, entries);
          if (!resolved) {
            resolved = true;
            resolve(entries);
          }
        }, (err) => {
          console.error(`Failed to load section "${section}"`, err);
          if (!resolved) {
            resolved = true;
            resolve([]);
          }
        });
        state.sectionListeners.set(section, sectionRef);
      });
    }

    // Headers + counts only — this is the lightweight listener that drives the
    // default page-load view. Actual word data is never pulled in here.
    function subscribeSectionSummary(language) {
      const ref = database.ref(`sectionSummary/${language}`);
      ref.on('value', (snapshot) => {
        state.sectionSummary = snapshot.val() || {};
        renderCurrentView();
      }, (err) => {
        console.error('Failed to subscribe to section summary', err);
      });
      return ref;
    }

    function subscribeHiddenSections(language) {
      const ref = database.ref(`hiddenSections/${language}`);
      ref.on('value', (snapshot) => {
        state.hiddenSections = snapshot.val() || {};
        renderCurrentView();
      }, (err) => {
        console.error('Failed to subscribe to hidden sections', err);
      });
      return ref;
    }

    function teardownLanguageData() {
      closeSectionAdd();
      if (state.sectionSummaryRef) {
        state.sectionSummaryRef.off('value');
        state.sectionSummaryRef = null;
      }
      if (state.hiddenSectionsRef) {
        state.hiddenSectionsRef.off('value');
        state.hiddenSectionsRef = null;
      }
      state.sectionListeners.forEach(ref => ref.off('value'));
      state.sectionListeners.clear();
      state.sectionCache.clear();
      state.sectionSummary = {};
      state.hiddenSections = {};
      state.expandedSections.clear();
    }

    function switchLanguage(language) {
      teardownLanguageData();
      state.language = language;
      renderCurrentView(); // clears the list immediately instead of showing stale data

      // Bootstrap is a background, best-effort, admin-only write — it must never
      // block the summary subscription below (the lesson from the earlier bug
      // where a blocked migration write kept the whole page from rendering).
      bootstrapLanguageIfNeeded(language).catch(err => {
        console.error('Failed to bootstrap language index', err);
      });
      state.sectionSummaryRef = subscribeSectionSummary(language);
      state.hiddenSectionsRef = subscribeHiddenSections(language);
    }

    function attachCardInteractions(card, entry) {
      card.addEventListener('dblclick', (event) => {
        event.preventDefault();
        event.stopPropagation();
        if (!state.isAdmin) return;
        enterCardEditMode(card, entry);
      });
    }

    function buildDictionaryCardContent(entry) {
      const pronunciation = entry.pronunciation || '';
      const englishMeaning = entry.englishMeaning || '';
      return `
        <div class="min-w-0 flex-1 flex items-baseline gap-3">
          <div class="min-w-[100px] truncate text-sm font-semibold text-slate-900 leading-tight dark:text-slate-100">${escapeHtml(entry.word)}</div>
          <div class="min-w-[80px] truncate text-xs text-slate-500 leading-tight dark:text-slate-400">${escapeHtml(pronunciation)}</div>
          <div class="flex-1 truncate text-xs text-slate-600 leading-tight dark:text-slate-300">${escapeHtml(englishMeaning)}</div>
        </div>
      `;
    }

    // Turns a card in place into three inline text fields (word, pronunciation,
    // meaning) plus move/save/delete/clear controls — the clear/delete icons
    // match the quick-add panel's exactly. Editing happens directly on the
    // field the user wants to change; Save persists all three, Clear exits
    // without saving, and Move swaps in a section picker (see below).
    function enterCardEditMode(card, entry) {
      if (card.dataset.editing === '1') return;
      card.dataset.editing = '1';
      renderCardEditFields(card, entry);
    }

    function renderCardEditFields(card, entry) {
      card.innerHTML = `
        <div class="min-w-0 flex-1 flex items-center gap-2">
          <input type="text" data-field="word" value="${escapeHtml(entry.word)}" class="min-w-0 w-[100px] rounded-md border border-slate-200 bg-white px-1.5 py-1 text-sm font-semibold text-slate-900 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-200 dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100" />
          <input type="text" data-field="pronunciation" value="${escapeHtml(entry.pronunciation || '')}" class="min-w-0 w-[80px] rounded-md border border-slate-200 bg-white px-1.5 py-1 text-xs text-slate-500 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-200 dark:border-slate-600 dark:bg-slate-900 dark:text-slate-400" />
          <input type="text" data-field="englishMeaning" value="${escapeHtml(entry.englishMeaning || '')}" class="min-w-0 flex-1 rounded-md border border-slate-200 bg-white px-1.5 py-1 text-xs text-slate-600 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-200 dark:border-slate-600 dark:bg-slate-900 dark:text-slate-300" />
        </div>
        <div class="flex shrink-0 items-center gap-1">
          <button type="button" data-card-move title="Move to another section" class="rounded p-1 text-blue-500 hover:bg-blue-50 dark:text-blue-400 dark:hover:bg-blue-950/40">
            <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M2 10a.75.75 0 01.75-.75h12.59l-2.1-1.95a.75.75 0 111.02-1.1l3.5 3.25a.75.75 0 010 1.1l-3.5 3.25a.75.75 0 11-1.02-1.1l2.1-1.95H2.75A.75.75 0 012 10z" clip-rule="evenodd"/></svg>
          </button>
          <button type="button" data-card-save title="Save" class="rounded p-1 text-emerald-600 hover:bg-emerald-50 dark:text-emerald-400 dark:hover:bg-emerald-950/40">
            <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.704 4.153a.75.75 0 01.143 1.052l-8 10.5a.75.75 0 01-1.127.075l-4.5-4.5a.75.75 0 011.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 011.05-.143z" clip-rule="evenodd"/></svg>
          </button>
          <button type="button" data-card-delete title="Delete this word" class="rounded p-1 text-rose-500 hover:bg-rose-50 dark:text-rose-400 dark:hover:bg-rose-950/40">
            <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8.75 1A2.75 2.75 0 006 3.75v.443c-.795.077-1.584.176-2.365.298a.75.75 0 10.23 1.482l.149-.022.841 10.518A2.75 2.75 0 007.596 19h4.807a2.75 2.75 0 002.742-2.53l.841-10.52.149.023a.75.75 0 00.23-1.482 41.03 41.03 0 00-2.365-.298V3.75A2.75 2.75 0 0011.25 1h-2.5zM10 4c.84 0 1.673.025 2.5.075V3.75c0-.69-.56-1.25-1.25-1.25h-2.5c-.69 0-1.25.56-1.25 1.25v.325C8.327 4.025 9.16 4 10 4zM8.58 7.72a.75.75 0 00-1.5.06l.3 7.5a.75.75 0 101.5-.06l-.3-7.5zm4.34.06a.75.75 0 10-1.5-.06l-.3 7.5a.75.75 0 101.5.06l.3-7.5z" clip-rule="evenodd"/></svg>
          </button>
          <button type="button" data-card-clear title="Clear" class="rounded p-1 text-slate-400 hover:bg-slate-100 dark:text-slate-500 dark:hover:bg-slate-700">
            <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="M6.28 5.22a.75.75 0 10-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 10-1.06-1.06L10 8.94 6.28 5.22z"/></svg>
          </button>
        </div>
      `;

      card.querySelectorAll('input').forEach(input => {
        input.addEventListener('click', (event) => event.stopPropagation());
        input.addEventListener('dblclick', (event) => event.stopPropagation());
      });
      card.querySelector('[data-card-move]').addEventListener('click', (event) => {
        event.stopPropagation();
        renderCardSectionPicker(card, entry);
      });
      card.querySelector('[data-card-clear]').addEventListener('click', (event) => {
        event.stopPropagation();
        exitCardEditMode(card, entry);
      });
      card.querySelector('[data-card-delete]').addEventListener('click', (event) => {
        event.stopPropagation();
        deleteWordEntry(entry);
      });
      card.querySelector('[data-card-save]').addEventListener('click', (event) => {
        event.stopPropagation();
        saveCardEdits(card, entry);
      });
    }

    // Swaps the card's fields row for a single section input (autocompleted
    // against existing sections via the shared datalist) plus confirm/back
    // controls — an arrow pair to mirror the move button that opened it.
    function renderCardSectionPicker(card, entry) {
      card.innerHTML = `
        <div class="min-w-0 flex-1 flex items-center gap-2">
          <input type="text" data-field="section" value="${escapeHtml(entry.section)}" list="card-section-options" placeholder="Section" class="min-w-0 flex-1 rounded-md border border-blue-300 bg-white px-1.5 py-1 text-sm font-medium text-slate-900 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-200 dark:border-blue-700 dark:bg-slate-900 dark:text-slate-100" />
        </div>
        <div class="flex shrink-0 items-center gap-1">
          <button type="button" data-card-move-confirm title="Move here" class="rounded p-1 text-emerald-600 hover:bg-emerald-50 dark:text-emerald-400 dark:hover:bg-emerald-950/40">
            <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.704 4.153a.75.75 0 01.143 1.052l-8 10.5a.75.75 0 01-1.127.075l-4.5-4.5a.75.75 0 011.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 011.05-.143z" clip-rule="evenodd"/></svg>
          </button>
          <button type="button" data-card-move-back title="Back" class="rounded p-1 text-slate-400 hover:bg-slate-100 dark:text-slate-500 dark:hover:bg-slate-700">
            <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a.75.75 0 01-.75.75H4.66l2.1 1.95a.75.75 0 11-1.02 1.1l-3.5-3.25a.75.75 0 010-1.1l3.5-3.25a.75.75 0 111.02 1.1l-2.1 1.95h12.59a.75.75 0 01.75.75z" clip-rule="evenodd"/></svg>
          </button>
        </div>
      `;

      const datalist = document.getElementById('card-section-options');
      datalist.innerHTML = getDistinctSections().map(name => `<option value="${escapeHtml(name)}"></option>`).join('');

      const sectionField = card.querySelector('[data-field="section"]');
      sectionField.addEventListener('click', (event) => event.stopPropagation());
      sectionField.addEventListener('dblclick', (event) => event.stopPropagation());
      sectionField.addEventListener('input', () => {
        const cursor = sectionField.selectionStart;
        const upper = sectionField.value.toUpperCase();
        if (upper !== sectionField.value) {
          sectionField.value = upper;
          sectionField.setSelectionRange(cursor, cursor);
        }
      });
      sectionField.addEventListener('keydown', (event) => {
        event.stopPropagation();
        if (event.key === 'Enter') {
          event.preventDefault();
          confirmCardMove(card, entry, sectionField.value);
        } else if (event.key === 'Escape') {
          renderCardEditFields(card, entry);
        }
      });
      sectionField.focus();
      sectionField.select();

      card.querySelector('[data-card-move-confirm]').addEventListener('click', (event) => {
        event.stopPropagation();
        confirmCardMove(card, entry, sectionField.value);
      });
      card.querySelector('[data-card-move-back]').addEventListener('click', (event) => {
        event.stopPropagation();
        renderCardEditFields(card, entry);
      });
    }

    async function confirmCardMove(card, entry, rawSection) {
      const section = (rawSection || '').trim().toUpperCase() || 'UNCATEGORIZED';
      if (section === entry.section) {
        renderCardEditFields(card, entry);
        return;
      }
      try {
        const snapshot = await wordsRef.child(state.language).child(entry.section).child(entry.id).once('value');
        const data = snapshot.val();
        if (data) {
          await database.ref().update({
            [`words/${state.language}/${entry.section}/${entry.id}`]: null,
            [`words/${state.language}/${section}/${entry.id}`]: data
          });
          await Promise.all([
            bumpSectionCount(state.language, entry.section, -1),
            bumpSectionCount(state.language, section, 1)
          ]);
          entry.section = section;
        }
      } catch (err) {
        console.error('Failed to move word to new section', err);
        window.alert('Failed to move word. See console for details.');
        return;
      }
      exitCardEditMode(card, entry);
    }

    function exitCardEditMode(card, entry) {
      card.dataset.editing = '';
      card.innerHTML = buildDictionaryCardContent(entry);
      attachCardInteractions(card, entry);
    }

    async function saveCardEdits(card, entry) {
      const word = card.querySelector('[data-field="word"]').value.trim();
      const pronunciation = card.querySelector('[data-field="pronunciation"]').value.trim();
      const englishMeaning = card.querySelector('[data-field="englishMeaning"]').value.trim();
      if (!word) {
        window.alert('Word cannot be empty.');
        return;
      }
      try {
        await wordsRef.child(state.language).child(entry.section).child(entry.id).update({ w: word, p: pronunciation, em: englishMeaning });
      } catch (err) {
        console.error('Failed to save word', err);
        window.alert('Failed to save word. See console for details.');
        return;
      }
      entry.word = word;
      entry.pronunciation = pronunciation;
      entry.englishMeaning = englishMeaning;
      exitCardEditMode(card, entry);
    }

    function getDistinctSections() {
      return Object.keys(state.sectionSummary)
        .filter(section => section !== 'UNCATEGORIZED')
        .sort((a, b) => a.localeCompare(b));
    }

    function buildDictionaryCard(entry) {
      const card = document.createElement('article');
      card.className = 'compact-card transition-colors duration-150 flex items-center justify-between gap-2';
      card.innerHTML = buildDictionaryCardContent(entry);
      attachCardInteractions(card, entry);
      return card;
    }

    // Always the section-wise view now — search filters the section list
    // itself down to matching names (it never touches word content); a
    // section's actual word cards are fetched lazily, only once expanded.
    function renderCurrentView() {
      renderSectionHeaders();
    }

    // Default view: section headers + counts only, straight from sectionSummary.
    // A section's actual word cards are fetched (via ensureSectionLoaded) only
    // when that section is expanded, or quizzed/read. A search query filters
    // this list down to sections whose NAME matches — it never searches word
    // content, so it never needs to fetch anything beyond the header list.
    // Word count for one section plus its subsections — used both for the
    // rendered rows' own counts and for the hidden/visible overview totals.
    function getSectionWordTotal(section) {
      const ownCount = state.sectionSummary[section] || 0;
      const subCount = getSubsectionsOf(section).reduce((s, sub) => s + (state.sectionSummary[sub] || 0), 0);
      return ownCount + subCount;
    }

    // Always reflects the full corpus (not the current search filter), so it
    // reads as a stable "here's everything" overview next to the eye toggle.
    function updateEntryCounts() {
      let hiddenTotal = 0;
      let visibleTotal = 0;
      getTopLevelSectionNames().forEach(section => {
        const total = getSectionWordTotal(section);
        if (isSectionHidden(section)) hiddenTotal += total;
        else visibleTotal += total;
      });
      dictionaryCount.textContent = `${hiddenTotal} hidden | ${visibleTotal} visible`;
    }

    function renderSectionHeaders() {
      const query = normalize(state.query);
      const sections = getTopLevelSectionNames()
        .filter(section => !query || section.toLowerCase().includes(query))
        .filter(section => isSectionHidden(section) === state.showHidden);
      updateEntryCounts();
      dictionaryList.innerHTML = '';
      state.sectionHeaderDomRefs = new Map();

      if (!sections.length) return;

      sections.forEach(section => {
        const wrapper = buildSectionDetailsShell(section, state.sectionSummary[section] || 0);
        state.sectionHeaderDomRefs.set(section, wrapper);
        dictionaryList.appendChild(wrapper);
        if (state.expandedSections.has(section)) {
          wrapper.querySelector('details').open = true;
          loadAndRenderSectionBody(section);
        }
      });

      reattachSectionAddWidgetIfNeeded();
    }

    // A section list re-render (filtering, live count updates, etc.) tears down
    // and rebuilds every wrapper — if the add-word widget was open for one of
    // these sections, it just got orphaned along with the old wrapper. Re-home
    // it into the freshly built wrapper (keeping whatever was typed so far), or
    // close it if that section no longer has a wrapper at all (e.g. filtered out).
    function reattachSectionAddWidgetIfNeeded() {
      if (state.sectionAdd.mode === 'idle') return;
      const wrapper = state.sectionHeaderDomRefs.get(state.sectionAdd.section);
      const summary = wrapper && wrapper.querySelector('summary');
      if (!summary) {
        closeSectionAdd();
        return;
      }
      summary.appendChild(sectionAddWidget);
    }

    // Enter in the section filter box: if the typed name doesn't match any
    // existing section, it creates a new (empty) one instead of just filtering
    // down to nothing — admins only, since this writes to the dictionary.
    function handleSectionFilterEnter() {
      if (!state.isAdmin) return;
      const raw = sectionFilterInput.value.trim();
      if (!raw) return;
      const normalized = raw.toUpperCase();
      if (Object.keys(state.sectionSummary).includes(normalized)) return;
      createNewSection(normalized);
    }

    async function createNewSection(section) {
      try {
        // Only seed a count if this section doesn't already exist — avoids a
        // race clobbering a concurrent admin's count with a stale 0.
        await database.ref(`sectionSummary/${state.language}/${section}`).transaction(current => (current === null ? 0 : current));
      } catch (err) {
        console.error('Failed to create section', err);
        window.alert('Failed to create section. See console for details.');
        return;
      }
      sectionFilterInput.value = '';
      state.query = '';
      state.expandedSections.add(section);
      renderCurrentView();
      const wrapper = state.sectionHeaderDomRefs.get(section);
      if (wrapper) wrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // Returns a wrapper <div> containing the <details> plus a sibling actions
    // bar — the actions bar can't live inside the <details> at all (not even
    // as a sibling of <summary>): Chromium refuses to render or hit-test any
    // non-summary child of a closed <details>, and that isn't something CSS
    // can override (display/content-visibility overrides had no effect). It
    // also can't live inside <summary> — interactive controls nested there
    // aren't reliably reachable by keyboard/assistive tech. A true sibling of
    // <details> itself is unaffected by any of that.
    function buildSectionDetailsShell(section, count) {
      const sub = isSubsection(section);

      const wrapper = document.createElement('div');
      wrapper.className = sub ? 'section-row section-row-sub' : 'section-row';

      const details = document.createElement('details');
      details.className = 'section-group';

      const summary = document.createElement('summary');
      const label = sub ? getSubsectionLabel(section) : section;
      summary.innerHTML = `<span class="section-label">${escapeHtml(label)} (${count})</span>`;
      details.appendChild(summary);

      const body = document.createElement('div');
      body.className = 'section-body space-y-2';
      body.innerHTML = '<div class="text-xs text-slate-400 dark:text-slate-500 py-1">Loading…</div>';
      details.appendChild(body);

      details.addEventListener('toggle', () => {
        if (details.open) {
          state.expandedSections.add(section);
          loadAndRenderSectionBody(section);
        } else {
          state.expandedSections.delete(section);
        }
      });

      wrapper.appendChild(details);

      const actions = document.createElement('span');
      actions.className = 'section-actions';
      const addTitle = sub ? 'Add a word to this subsection' : 'Add a word (or type > name for a subsection)';
      const quizTitle = sub ? 'Quiz this subsection' : 'Quiz this section (and its subsections)';
      const readTitle = sub ? 'Read this subsection' : 'Read this section (and its subsections)';
      // Its icon just mirrors whichever list is currently on screen: in the
      // default view every row shown is enabled (plain eye, click to hide); in
      // the hidden view every row shown is hidden (eye-slash, click to un-hide).
      const eyeTitle = state.showHidden ? 'Un-hide this' : 'Hide this';
      actions.innerHTML = `
        ${state.isAdmin ? `<button type="button" class="section-action-btn" data-section-add title="${addTitle}">+</button>` : ''}
        <button type="button" class="section-action-btn" data-section-quiz title="${quizTitle}">✦</button>
        <button type="button" class="section-action-btn" data-section-read title="${readTitle}">▶</button>
        ${state.isAdmin ? `<button type="button" class="section-action-btn" data-section-eye title="${eyeTitle}"><svg class="h-3 w-3" viewBox="0 0 20 20" fill="currentColor">${state.showHidden ? EYE_SLASH_ICON_PATHS : EYE_ICON_PATHS}</svg></button>` : ''}
      `;
      const addBtn = actions.querySelector('[data-section-add]');
      if (addBtn) {
        addBtn.addEventListener('click', (event) => {
          event.preventDefault();
          event.stopPropagation();
          toggleSectionAddWidget(section, wrapper);
        });
      }
      const quizBtn = actions.querySelector('[data-section-quiz]');
      if (quizBtn) quizBtn.addEventListener('click', (event) => {
        event.preventDefault();
        event.stopPropagation();
        startSectionQuiz(section);
      });
      const readBtn = actions.querySelector('[data-section-read]');
      if (readBtn) readBtn.addEventListener('click', (event) => {
        event.preventDefault();
        event.stopPropagation();
        startSectionReading(section);
      });
      const eyeBtn = actions.querySelector('[data-section-eye]');
      if (eyeBtn) eyeBtn.addEventListener('click', (event) => {
        event.preventDefault();
        event.stopPropagation();
        toggleSectionHidden(section);
      });
      wrapper.appendChild(actions);

      return wrapper;
    }

    function loadAndRenderSectionBody(section) {
      ensureSectionLoaded(section).then(entries => renderSectionBodyIfPresent(section, entries));
    }

    // Called both right after a section's data first arrives and on every later
    // live update to it — a no-op if that section isn't currently on screen
    // (e.g. it's been filtered out by search, or the view is alpha-grouped).
    // Subsections render nested, at the top of their parent's body, ahead of
    // that parent's own word cards — a subsection never gets nested further.
    function renderSectionBodyIfPresent(section, entries) {
      const wrapper = state.sectionHeaderDomRefs && state.sectionHeaderDomRefs.get(section);
      if (!wrapper || !dictionaryList.contains(wrapper)) return;
      const body = wrapper.querySelector('.section-body');
      if (!body) return;

      body.innerHTML = '';

      const subsections = isSubsection(section)
        ? []
        : getSubsectionsOf(section).filter(sub => isSectionHidden(sub) === state.showHidden);
      subsections.forEach(sub => {
        const subWrapper = buildSectionDetailsShell(sub, state.sectionSummary[sub] || 0);
        state.sectionHeaderDomRefs.set(sub, subWrapper);
        body.appendChild(subWrapper);
        if (state.expandedSections.has(sub)) {
          subWrapper.querySelector('details').open = true;
          loadAndRenderSectionBody(sub);
        }
      });

      if (!entries.length) {
        if (!subsections.length) {
          const empty = document.createElement('div');
          empty.className = 'text-xs text-slate-400 dark:text-slate-500 py-1';
          empty.textContent = 'No words yet.';
          body.appendChild(empty);
        }
      } else {
        // A dedicated wrapper (no space-y gap) so entries butt up against each
        // other with just the hairline divider between them, instead of the
        // section-body's normal item spacing (which still applies to the
        // subsection rows above, and between this list and them).
        const wordList = document.createElement('div');
        wordList.className = 'word-list';
        entries.forEach(entry => wordList.appendChild(buildDictionaryCard(entry)));
        body.appendChild(wordList);
      }

      reattachSectionAddWidgetIfNeeded();
    }

    // ---- Section add: single-field word entry, traversed field by field,
    // scoped to one fixed section (opened via that section's "+") ----
    //
    // Type a word (English or native script — direction is auto-detected),
    // then Enter steps through the resolved fields one at a time, loading each
    // into the same input in place of the last (word -> pronunciation ->
    // meaning), editable at every stage. A panel below the input shows all
    // three throughout, highlighting whichever one is currently loaded into
    // the field. A final Enter (from the meaning stage) saves straight into
    // the section this widget was opened for — there's no category step here,
    // since the section is already fixed. Escape/Clear cancels at any point.
    //
    // Independently, a 2-second poll compares the field's current text to
    // what it held at the last check: if it changed, that's treated as a
    // fresh edit — a full re-translation at the word stage, or a direct
    // correction to the current field at the pronunciation/meaning stages —
    // and the panel is refreshed either way.

    // Matches the per-direction ordering the app already showed in the
    // (now-removed) review popup — same fields, same order, just traversed
    // one at a time instead of shown all at once.
    function getQuickAddFieldOrder(direction) {
      return direction === 'toNative'
        ? ['englishMeaning', 'word', 'pronunciation']
        : ['word', 'pronunciation', 'englishMeaning'];
    }

    function buildQuickAddParts(resolved) {
      return getQuickAddFieldOrder(resolved.direction).map(key => ({ key, value: resolved[key] }));
    }

    function isSectionAddOpenFor(section) {
      return state.sectionAdd.mode !== 'idle' && state.sectionAdd.section === section;
    }

    function toggleSectionAddWidget(section, wrapper) {
      if (isSectionAddOpenFor(section)) {
        closeSectionAdd();
        return;
      }
      openSectionAdd(section, wrapper);
    }

    function openSectionAdd(section, wrapper) {
      closeSectionAdd();
      const summary = wrapper.querySelector('summary');
      if (!summary) return;
      state.sectionAdd = { mode: 'entering', section, stageIndex: 0, resolved: null, lastCheckedText: null };
      sectionAddInput.value = '';
      sectionAddInput.disabled = false;
      sectionAddInput.placeholder = 'Type a word…';
      sectionAddPanel.classList.add('hidden');
      sectionAddPreviewRows.innerHTML = '';
      summary.appendChild(sectionAddWidget);
      startSectionAddChecker();
      sectionAddInput.focus();
    }

    function closeSectionAdd() {
      stopSectionAddChecker();
      state.sectionAdd = { mode: 'idle', section: null, stageIndex: 0, resolved: null, lastCheckedText: null };
      sectionAddInput.value = '';
      sectionAddInput.disabled = false;
      sectionAddInput.placeholder = 'Type a word…';
      sectionAddPanel.classList.add('hidden');
      sectionAddPreviewRows.innerHTML = '';
      sectionAddHome.appendChild(sectionAddWidget);
    }

    // One line, no labels — just the typed word, its pronunciation, and the
    // translated word, dot-separated, with whichever one is currently loaded
    // into the input highlighted.
    function renderSectionAddPanel() {
      const resolved = state.sectionAdd.resolved;
      if (!resolved) {
        sectionAddPanel.classList.add('hidden');
        return;
      }
      const parts = buildQuickAddParts(resolved);
      const pieces = parts.map((part, index) => `<span class="${
        index === state.sectionAdd.stageIndex
          ? 'rounded bg-blue-50 px-1 font-semibold text-blue-900 dark:bg-blue-950/40 dark:text-blue-200'
          : 'text-slate-500 dark:text-slate-400'
      }">${escapeHtml(part.value || '—')}</span>`);
      sectionAddPreviewRows.innerHTML = `
        <div class="flex flex-wrap items-center gap-1.5 px-1 py-1 text-xs">
          ${pieces.join('<span class="text-slate-300 dark:text-slate-600">·</span>')}
        </div>
      `;
      sectionAddPanel.classList.remove('hidden');
    }

    let sectionAddCheckTimer = null;

    function startSectionAddChecker() {
      if (sectionAddCheckTimer) return;
      sectionAddCheckTimer = setInterval(checkSectionAddForChanges, 2000);
    }

    function stopSectionAddChecker() {
      clearInterval(sectionAddCheckTimer);
      sectionAddCheckTimer = null;
    }

    // The 2-second poll: only reacts when the field's text actually differs
    // from what it held at the last check.
    async function checkSectionAddForChanges() {
      if (state.sectionAdd.mode !== 'entering') return;
      const text = sectionAddInput.value.trim();
      if (text.startsWith('>')) return; // handled instantly by the input handler instead
      if (text === state.sectionAdd.lastCheckedText) return;
      if (!text) {
        state.sectionAdd.lastCheckedText = text;
        return;
      }

      const stageIndex = state.sectionAdd.stageIndex;
      if (stageIndex === 0) {
        const resolved = await resolveQuickAddFields(text);
        // Bail if the field moved on while this was resolving.
        if (state.sectionAdd.mode !== 'entering' || state.sectionAdd.stageIndex !== 0 || sectionAddInput.value.trim() !== text) return;
        state.sectionAdd.resolved = resolved;
      } else if (state.sectionAdd.resolved) {
        const key = getQuickAddFieldOrder(state.sectionAdd.resolved.direction)[stageIndex];
        state.sectionAdd.resolved[key] = text;
      }
      state.sectionAdd.lastCheckedText = text;
      renderSectionAddPanel();
    }

    // A '>' prefix (only meaningful at the very first stage, before any
    // translation has started) means "create a subsection" instead of "add a
    // word" — shows a live preview of the name as it's typed, no translation
    // involved.
    function renderSubsectionHint(name) {
      sectionAddPreviewRows.innerHTML = `
        <div class="flex flex-wrap items-center gap-1.5 px-1 py-1 text-xs">
          <span class="text-slate-400 dark:text-slate-500">New subsection:</span>
          <span class="rounded bg-blue-50 px-1 font-semibold text-blue-900 dark:bg-blue-950/40 dark:text-blue-200">${escapeHtml(name || '—')}</span>
        </div>
      `;
      sectionAddPanel.classList.remove('hidden');
    }

    async function createSubsectionUnder(parentSection, rawName) {
      if (isSubsection(parentSection)) {
        window.alert('Subsections can\'t be nested further.');
        closeSectionAdd();
        return;
      }
      const childLabel = rawName.trim().toUpperCase();
      if (!childLabel) {
        window.alert('Type a name for the subsection after ">".');
        return;
      }
      const fullName = `${parentSection}>${childLabel}`;
      if (Object.keys(state.sectionSummary).includes(fullName)) {
        window.alert(`"${childLabel}" already exists under ${parentSection}.`);
        closeSectionAdd();
        return;
      }
      try {
        // Only seed a count if this subsection doesn't already exist — avoids
        // a race clobbering a concurrent admin's count with a stale 0.
        await database.ref(`sectionSummary/${state.language}/${fullName}`).transaction(current => (current === null ? 0 : current));
      } catch (err) {
        console.error('Failed to create subsection', err);
        window.alert('Failed to create subsection. See console for details.');
        return;
      }
      state.expandedSections.add(parentSection);
      state.expandedSections.add(fullName);
      closeSectionAdd();
      renderCurrentView();
      const parentWrapper = state.sectionHeaderDomRefs.get(parentSection);
      if (parentWrapper) parentWrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // The Enter handler while composing: advances one stage at a time — word
    // -> pronunciation -> meaning — capturing any manual edit at the current
    // stage before moving to the next. After the meaning stage, saves
    // directly into the fixed section (no category step to pass through).
    async function advanceSectionAddStage() {
      if (state.sectionAdd.mode !== 'entering') return;
      const text = sectionAddInput.value.trim();
      if (!text) return;

      const stageIndex = state.sectionAdd.stageIndex;

      if (stageIndex === 0 && text.startsWith('>')) {
        await createSubsectionUnder(state.sectionAdd.section, text.slice(1));
        return;
      }

      if (stageIndex === 0) {
        // Reuse the poller's resolution if it already caught up with this
        // exact text; otherwise resolve it now rather than make the user wait
        // for the next 2-second tick.
        if (!state.sectionAdd.resolved || state.sectionAdd.lastCheckedText !== text) {
          sectionAddInput.disabled = true;
          sectionAddInput.placeholder = 'Translating…';
          state.sectionAdd.resolved = await resolveQuickAddFields(text);
          state.sectionAdd.lastCheckedText = text;
          sectionAddInput.disabled = false;
        }
      } else {
        const key = getQuickAddFieldOrder(state.sectionAdd.resolved.direction)[stageIndex];
        state.sectionAdd.resolved[key] = text;
      }
      renderSectionAddPanel();

      if (stageIndex < 2) {
        state.sectionAdd.stageIndex = stageIndex + 1;
        const nextKey = getQuickAddFieldOrder(state.sectionAdd.resolved.direction)[state.sectionAdd.stageIndex];
        const nextValue = state.sectionAdd.resolved[nextKey] || '';
        sectionAddInput.value = nextValue;
        state.sectionAdd.lastCheckedText = nextValue;
        sectionAddInput.select();
        renderSectionAddPanel();
        return;
      }

      const resolved = state.sectionAdd.resolved;
      const section = state.sectionAdd.section;
      const exists = await wordExistsInLanguage(normalize(resolved.word));
      if (exists) {
        window.alert(`"${resolved.word}" already exists in the ${getCurrentLanguageData().label} dictionary.`);
        closeSectionAdd();
        return;
      }
      try {
        await wordsRef.child(state.language).child(section).push({ w: resolved.word, p: resolved.pronunciation, em: resolved.englishMeaning, c: Date.now() });
        await bumpSectionCount(state.language, section, 1);
      } catch (err) {
        console.error('Failed to save word', err);
        window.alert('Failed to save word. See console for details.');
      }
      closeSectionAdd();
    }

    async function deleteWordEntry(entry) {
      if (!entry) return;
      if (!window.confirm(`Delete "${entry.word}"?`)) return;
      if (!state.isAdmin) {
        window.alert('You are not authorized to delete this entry.');
        return;
      }
      try {
        await wordsRef.child(state.language).child(entry.section).child(entry.id).remove();
        await bumpSectionCount(state.language, entry.section, -1);
      } catch (err) {
        console.error('Failed to delete entry', err);
        window.alert('Failed to delete entry. See console for details.');
      }
    }

    function openQuizModal() {
      quizModal.classList.add('open');
      quizStatus.textContent = 'Quiz paused';
      quizWord.textContent = 'Ready?';
      quizPronunciation.textContent = '';
      quizPronunciation.classList.add('hidden');
      quizMeaning.textContent = 'Click start to begin.';
      state.quizQueue = [];
      state.quizMissed = [];
      state.quizCurrent = null;
      state.quizTotal = 0;
      state.quizMode = 'idle';
      state.warOnWrongSet = null;
      quizStart.textContent = 'Start quiz';
      quizStart.disabled = false;
      quizActions.classList.remove('flex');
      quizActions.classList.add('hidden');
    }

    function closeQuizModal() {
      quizModal.classList.remove('open');
      // Let any sequencer awaiting the current round unwind cleanly instead of
      // hanging forever on a promise nobody will ever resolve.
      const resolve = state.quizRoundResolve;
      state.quizRoundResolve = null;
      state.quizSectionQueue = [];
      state.quizSectionIndex = -1;
      state.quizCurrentSection = null;
      if (resolve) resolve();
    }

    function renderQuizCard() {
      const entry = state.quizCurrent;
      quizWord.textContent = entry ? (entry.word || '—') : '—';

      if (entry && quizTogglePronunciation.checked && entry.pronunciation) {
        quizPronunciation.textContent = entry.pronunciation;
        quizPronunciation.classList.remove('hidden');
      } else {
        quizPronunciation.textContent = '';
        quizPronunciation.classList.add('hidden');
      }

      if (entry && quizToggleMeaning.checked) {
        quizMeaning.textContent = entry.englishMeaning || 'No meaning available';
      } else {
        quizMeaning.textContent = '';
      }
    }

    function beginRound(queue) {
      state.quizQueue = queue;
      state.quizMissed = [];
      state.quizTotal = queue.length;
      quizStart.textContent = 'Running...';
      quizStart.disabled = true;
      quizActions.classList.remove('hidden');
      quizActions.classList.add('flex');
      showNextQuizWord();
    }

    function showNextQuizWord() {
      const section = getSectionDisplayLabel(state.quizCurrentSection || 'UNCATEGORIZED');
      if (!state.quizQueue.length) {
        endRound();
        return;
      }
      state.quizCurrent = state.quizQueue.shift();
      renderQuizCard();
      quizStatus.textContent = `${section} — Question ${state.quizTotal - state.quizQueue.length}/${state.quizTotal}`;
    }

    function advanceQuiz() {
      state.quizCurrent = null;
      showNextQuizWord();
    }

    function handleCorrect() {
      if (!state.quizCurrent) return;
      advanceQuiz();
    }

    function handleWrong() {
      if (!state.quizCurrent) return;
      state.quizMissed.push(state.quizCurrent);
      advanceQuiz();
    }

    function endRound() {
      quizActions.classList.remove('flex');
      quizActions.classList.add('hidden');
      quizPronunciation.classList.add('hidden');
      const section = getSectionDisplayLabel(state.quizCurrentSection || 'UNCATEGORIZED');

      if (!state.quizMissed.length) {
        quizStatus.textContent = state.quizMode === 'warOnWrong'
          ? `${section} — WarOnWrong cleared!`
          : `${section} — Quiz complete! No missed words.`;
        quizWord.textContent = 'Done!';
        quizMeaning.textContent = '';
        quizStart.textContent = 'Restart';
        quizStart.disabled = false;
        state.quizMode = 'idle';
        state.warOnWrongSet = null;

        // Resolve this section's round — this is what lets the app-level
        // sequencer move on to the next section only once this one is clear.
        const resolve = state.quizRoundResolve;
        state.quizRoundResolve = null;
        if (resolve) resolve();
        return;
      }

      if (state.quizMode === 'normal') {
        state.warOnWrongSet = state.quizMissed.slice();
        state.quizMode = 'warOnWrong';
      }

      // Do-or-die: every WarOnWrong attempt restarts from the same missed set
      // captured when we first entered it — a single miss resets the whole pass.
      const retryQueue = state.warOnWrongSet.map(entry => ({ ...entry }));
      quizStatus.textContent = `${section} — WarOnWrong: ${retryQueue.length} word(s) — get them all right to finish`;
      beginRound(retryQueue);
    }

    // Reusable core: quizzes a single section (with WarOnWrong retries) to
    // completion. Used both by the section-level Quiz button and as one step
    // of the app-level sequential quiz below.
    function runSectionQuiz(section, entries) {
      return new Promise((resolve) => {
        state.quizCurrentSection = section;
        state.quizRoundResolve = resolve;
        state.quizMode = 'normal';
        state.warOnWrongSet = null;
        beginRound(entries.map(entry => ({ ...entry })));
      });
    }

    // Quizzing a section also covers its subsections (announced/tracked as
    // their own queue entries) — a subsection quizzed directly just expands
    // to itself, since it has none of its own.
    async function startSectionQuiz(section) {
      openQuizModal();
      state.quizSectionQueue = expandWithSubsections([section]);
      state.quizSectionIndex = 0;
      await runQuizSectionQueue();
    }

    async function startAppLevelQuiz() {
      openQuizModal();
      const sections = getTopLevelSectionNames();
      if (!sections.length) {
        quizStatus.textContent = 'No sections to quiz yet.';
        return;
      }
      state.quizSectionQueue = expandWithSubsections(sections);
      state.quizSectionIndex = 0;
      await runQuizSectionQueue();
    }

    // Sequences through state.quizSectionQueue one section at a time — the next
    // section is only fetched once the current one's round is fully cleared.
    async function runQuizSectionQueue() {
      for (; state.quizSectionIndex < state.quizSectionQueue.length; state.quizSectionIndex++) {
        if (!quizModal.classList.contains('open')) return;
        const section = state.quizSectionQueue[state.quizSectionIndex];
        quizStatus.textContent = `Loading ${getSectionDisplayLabel(section)}…`;
        const entries = await ensureSectionLoaded(section);
        if (!quizModal.classList.contains('open')) return;
        if (!entries.length) continue; // nothing to quiz in this section, skip it
        await runSectionQuiz(section, entries);
        if (!quizModal.classList.contains('open')) return;
      }
      quizStatus.textContent = 'All sections complete!';
      quizWord.textContent = 'Done!';
      quizMeaning.textContent = '';
      quizStart.textContent = 'Restart';
      quizStart.disabled = false;
    }

    // The quiz-modal "Start quiz"/"Restart" button re-runs whichever section
    // queue is currently loaded (a single section, or the full app-level list),
    // starting again from the top.
    function restartQuizSequence() {
      if (!state.quizSectionQueue.length) return;
      state.quizSectionIndex = 0;
      runQuizSectionQueue();
    }

    function shuffle(array) {
      const copy = array.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    let cachedVoicesByLang = new Map();

    function normalizeSpeechText(text, language) {
      if (!text) return '';
      const normalized = String(text).trim().replace(/\s+/g, ' ');
      if (language === 'ja') {
        return normalized.replace(/[。！？]/g, '.').replace(/-/g, ' ').replace(/_/g, ' ');
      }
      if (language === 'te') {
        return normalized.replace(/-/g, ' ').replace(/_/g, ' ');
      }
      return normalized;
    }

    function getBestVoice(languageCode) {
      if (cachedVoicesByLang.has(languageCode)) {
        return Promise.resolve(cachedVoicesByLang.get(languageCode));
      }

      return new Promise((resolve) => {
        const pick = (voices) => {
          const normalizedCode = languageCode.toLowerCase();
          const matching = voices.filter(voice => voice.lang && voice.lang.toLowerCase().startsWith(normalizedCode));
          const best = matching.find(voice => /google|natural|enhanced|premium|neural|wave/i.test(voice.name))
            || matching[0]
            || voices.find(voice => voice.lang && voice.lang.toLowerCase().startsWith('en'))
            || voices[0]
            || null;
          cachedVoicesByLang.set(languageCode, best);
          resolve(best);
        };

        const voices = window.speechSynthesis.getVoices();
        if (voices.length) {
          pick(voices);
          return;
        }

        window.speechSynthesis.onvoiceschanged = () => pick(window.speechSynthesis.getVoices());
      });
    }

    async function speak(text, languageCode = 'en-US', rate = 0.95, pitch = 1) {
      if (!text || !('speechSynthesis' in window)) return;
      const voice = await getBestVoice(languageCode);
      return new Promise((resolve) => {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = languageCode;
        utterance.rate = rate;
        utterance.pitch = pitch;
        utterance.volume = 1;
        if (voice) utterance.voice = voice;
        utterance.onend = resolve;
        utterance.onerror = resolve;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
      });
    }

    async function toSpokenText(text, sourceLang) {
      if (!text) return '';
      if (sourceLang === 'en') return text;

      const normalized = String(text).trim();
      if (sourceLang === 'ja') {
        return normalizeSpeechText(normalized, 'ja');
      }
      if (sourceLang === 'te') {
        return normalizeSpeechText(normalized, 'te');
      }

      const romanized = await getRomanization(text, sourceLang, 'en');
      return romanized || normalized;
    }

    function renderReadingCard(entry) {
      readingWord.textContent = entry.word || '—';
      if (entry.pronunciation) {
        readingPronunciation.textContent = entry.pronunciation;
        readingPronunciation.classList.remove('hidden');
      } else {
        readingPronunciation.textContent = '';
        readingPronunciation.classList.add('hidden');
      }
      readingMeaning.textContent = entry.englishMeaning || 'No meaning available';
    }

    // Announces a new section as reading moves into it — shown on screen and,
    // since reading is a spoken-first interface, also spoken aloud in English
    // (section names are always plain English/Latin text, regardless of which
    // language's words are inside). A subsection is spoken by its own name
    // alone — repeating the full "PARENT → CHILD" path aloud every time reads
    // awkwardly once you're already mid-pass through that parent.
    async function announceReadingSection(section) {
      readingWord.textContent = getSectionDisplayLabel(section);
      readingPronunciation.classList.add('hidden');
      readingMeaning.textContent = 'Section';
      await speak(getSectionSpokenLabel(section), 'en-US', 0.95, 1);
    }

    // Reusable core: one shuffled pass through a single section's words, each
    // spoken in full (word, then meanings). Resolves once every word in the
    // pass has been read, or immediately if reading is stopped mid-pass.
    async function runSectionReadingPass(entries) {
      const queue = shuffle(entries);
      for (const entry of queue) {
        if (!state.readingActive) return;
        renderReadingCard(entry);

        // Each piece is spoken with the voice that actually matches its language —
        // reading the English meaning in a Japanese voice mispronounces it.
        const spokenWord = entry.pronunciation
          ? normalizeSpeechText(entry.pronunciation, 'ja')
          : await toSpokenText(entry.word, 'ja');

        await speak(spokenWord, 'ja-JP', 0.9, 1);
        if (!state.readingActive) return;

        if (entry.englishMeaning) {
          await speak(entry.englishMeaning, 'en-US', 0.95, 1);
          if (!state.readingActive) return;
        }

        await new Promise(resolve => {
          state.readingTimeoutId = setTimeout(resolve, 2000);
        });
      }
    }

    function openReadingModal() {
      readingModal.classList.add('open');
      readingWord.textContent = 'Read';
      readingPronunciation.classList.add('hidden');
      readingMeaning.textContent = 'Reading mode starting…';
      state.readingActive = true;
    }

    function closeReadingModal() {
      readingModal.classList.remove('open');
      state.readingActive = false;
      if (state.readingTimeoutId) {
        clearTimeout(state.readingTimeoutId);
        state.readingTimeoutId = null;
      }
      window.speechSynthesis.cancel();
      state.readingSectionQueue = [];
      state.readingSectionIndex = -1;
    }

    // Cycles indefinitely through a queue of sections (looping back to the
    // start), announcing each one by name only when it actually changes from
    // the last one read — so a single-section queue announces once and just
    // keeps repeating, while a multi-section queue (e.g. a parent followed by
    // its subsections) announces every time it moves to a different one. If a
    // full lap turns up no words anywhere, it stops instead of spinning
    // silently forever.
    async function runReadingSectionQueue(queue) {
      if (!queue.length) {
        readingMeaning.textContent = 'No sections to read yet.';
        return;
      }
      state.readingSectionQueue = queue;
      state.readingSectionIndex = 0;
      let lastAnnounced = null;
      let consecutiveEmpty = 0;

      while (state.readingActive) {
        const section = state.readingSectionQueue[state.readingSectionIndex];
        readingMeaning.textContent = `Loading ${getSectionDisplayLabel(section)}…`;
        const entries = await ensureSectionLoaded(section);
        if (!state.readingActive) break;

        if (entries.length) {
          consecutiveEmpty = 0;
          if (section !== lastAnnounced) {
            await announceReadingSection(section);
            lastAnnounced = section;
            if (!state.readingActive) break;
          }
          await runSectionReadingPass(entries);
        } else {
          consecutiveEmpty++;
          if (consecutiveEmpty >= state.readingSectionQueue.length) {
            readingMeaning.textContent = `${getSectionDisplayLabel(queue[0])} has no words yet.`;
            return;
          }
        }

        if (!state.readingActive) break;
        state.readingSectionIndex = (state.readingSectionIndex + 1) % state.readingSectionQueue.length;
      }
    }

    // Section-level Read button — also covers this section's subsections
    // (announced/tracked as their own queue entries) — a subsection read
    // directly just expands to itself, since it has none of its own.
    async function startSectionReading(section) {
      openReadingModal();
      await runReadingSectionQueue(expandWithSubsections([section]));
    }

    // Toolbar Read button: cycles through every section (and its subsections)
    // in turn, indefinitely — the next one's words are only fetched once the
    // current one's pass is fully done.
    async function startAppLevelReading() {
      openReadingModal();
      await runReadingSectionQueue(expandWithSubsections(getTopLevelSectionNames()));
    }

    function openScriptPracticeModal(scriptKey, label) {
      scriptPracticeTitle.textContent = `${label} Practice`;
      scriptPracticeFrame.src = `hiragana-karuta.html?script=${encodeURIComponent(scriptKey)}`;
      scriptPracticeModal.classList.add('open');
    }

    function closeScriptPracticeModal() {
      scriptPracticeModal.classList.remove('open');
      scriptPracticeFrame.src = 'about:blank';
    }

    sectionFilterInput.addEventListener('input', (event) => {
      state.query = event.target.value;
      renderCurrentView();
    });

    sectionFilterInput.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter') return;
      event.preventDefault();
      handleSectionFilterEnter();
    });

    quizButton.addEventListener('click', () => startAppLevelQuiz());
    quizClose.addEventListener('click', () => closeQuizModal());
    quizStart.addEventListener('click', () => restartQuizSequence());
    quizWrong.addEventListener('click', () => handleWrong());
    quizCorrect.addEventListener('click', () => handleCorrect());
    quizTogglePronunciation.addEventListener('change', () => { if (state.quizCurrent) renderQuizCard(); });
    quizToggleMeaning.addEventListener('change', () => { if (state.quizCurrent) renderQuizCard(); });
    readingButton.addEventListener('click', () => startAppLevelReading());
    readingClose.addEventListener('click', () => closeReadingModal());
    scriptPracticeClose.addEventListener('click', () => closeScriptPracticeModal());

    // The widget now lives inside <summary> so it sits right after the header
    // text — but a click anywhere in <summary> normally toggles the <details>
    // open/closed by default, which would fight with clicking into the field
    // or the clear button. preventDefault() anywhere along the bubble path
    // suppresses just that default action without blocking focus or typing,
    // so one listener on the whole widget covers the input, the panel, and
    // the clear button inside it.
    sectionAddWidget.addEventListener('click', (event) => event.preventDefault());
    sectionAddInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        advanceSectionAddStage();
      } else if (event.key === 'Escape') {
        closeSectionAdd();
      }
    });
    sectionAddInput.addEventListener('input', () => {
      const text = sectionAddInput.value;
      if (state.sectionAdd.stageIndex === 0 && text.trim().startsWith('>')) {
        stopSectionAddChecker();
        renderSubsectionHint(text.trim().slice(1).trim());
        return;
      }
      if (state.sectionAdd.stageIndex === 0 && !state.sectionAdd.resolved) {
        // Clear any subsection hint left over from a moment ago.
        sectionAddPanel.classList.add('hidden');
        sectionAddPreviewRows.innerHTML = '';
      }
      startSectionAddChecker();
    });
    sectionAddClearBtn.addEventListener('click', () => closeSectionAdd());

    const EYE_ICON_PATHS = `
      <path d="M10 12.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5z"></path>
      <path fill-rule="evenodd" d="M.664 10.59a1.651 1.651 0 010-1.186A10.004 10.004 0 0110 3c4.257 0 7.893 2.66 9.336 6.41.147.381.146.804 0 1.186A10.004 10.004 0 0110 17c-4.257 0-7.893-2.66-9.336-6.41zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"></path>
    `;
    const EYE_SLASH_ICON_PATHS = `
      <path fill-rule="evenodd" d="M3.28 2.22a.75.75 0 00-1.06 1.06l14.5 14.5a.75.75 0 101.06-1.06l-1.745-1.745a10.029 10.029 0 003.3-4.38 1.651 1.651 0 000-1.185A10.004 10.004 0 009.999 3a9.956 9.956 0 00-4.744 1.194L3.28 2.22zM7.752 6.69l1.092 1.092a2.5 2.5 0 013.374 3.373l1.091 1.092a4 4 0 00-5.557-5.557z" clip-rule="evenodd"></path>
      <path d="M10.748 13.93l2.523 2.523a9.987 9.987 0 01-3.27.547c-4.258 0-7.894-2.66-9.337-6.41a1.65 1.65 0 010-1.186A10.007 10.007 0 012.839 6.02L6.07 9.252a4 4 0 004.678 4.678z"></path>
    `;

    // Plain eye = showing enabled (non-hidden) sections, the default. Eye with
    // a strike = showing only sections that have been explicitly hidden, so
    // they can be found again and un-hidden.
    function updateHiddenToggleUI() {
      hiddenToggleIcon.innerHTML = state.showHidden ? EYE_SLASH_ICON_PATHS : EYE_ICON_PATHS;
      hiddenToggle.title = state.showHidden
        ? 'Showing hidden sections — click to view enabled ones'
        : 'Showing enabled sections — click to view hidden ones';
    }
    updateHiddenToggleUI();

    hiddenToggle.addEventListener('click', () => {
      state.showHidden = !state.showHidden;
      updateHiddenToggleUI();
      closeSectionAdd();
      renderCurrentView();
    });
  </script>
</body>
</html>
