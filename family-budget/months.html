<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f4">
  <title>Expense Tracker | Monthly ledger</title>
  <link rel="stylesheet" href="../family-budget.css">
  <script src="../family-budget.js" defer></script>
</head>
<body data-page="months">
  <header class="topbar ledger-topbar">
    <a class="brand" href="months.html" aria-label="Expense Tracker"><span class="brand-mark"><i class="ti ti-wallet" aria-hidden="true"></i></span><span class="brand-word">Expense Tracker</span></a>
    <div></div>
    <div class="header-actions">
      <span class="save-state"><span class="save-dot"></span> Saved</span>
      <button type="button" class="icon-button" id="year-settings-button" aria-label="Year settings" title="Year settings"><i class="ti ti-settings" aria-hidden="true"></i></button>
      <button type="button" class="icon-button" id="logout-button" aria-label="Log out" title="Log out"><i class="ti ti-logout-2" aria-hidden="true"></i></button>
    </div>
  </header>
  <main class="ledger" id="ledger">
    <h1 class="sr-only">Monthly ledger</h1>
    <div class="year-bar">
      <div class="year-tabs" id="year-tabs" role="group" aria-label="Year"></div>
      <span class="year-meta" id="year-meta"></span>
      <button type="button" class="quiet-button summary-toggle" data-toggle-universe aria-pressed="false" aria-controls="universe"><i class="ti ti-chart-bar" aria-hidden="true"></i><span>Year summary</span></button>
    </div>
    <div class="universe" id="universe">
      <div class="universe-inner">
        <section class="year-kpis" id="year-kpis" aria-label="Year to date"></section>
      </div>
    </div>
    <div class="month-ledger" id="month-ledger"></div>
  </main>
  <dialog class="modal config-dialog" id="year-settings-dialog" aria-labelledby="year-settings-title">
    <form id="year-settings-form" novalidate>
      <header class="config-head">
        <div class="modal-header"><div><p>Configuration</p><h2 id="year-settings-title">Year configuration</h2></div><button type="button" class="icon-button" data-close-dialog aria-label="Close"><i class="ti ti-x" aria-hidden="true"></i></button></div>
        <div class="config-years" id="config-years" role="group" aria-label="Year to configure"></div>
      </header>
      <div class="config-body">
        <section class="config-block" aria-labelledby="config-general-title">
          <div class="config-block-head"><h3 id="config-general-title">General</h3></div>
          <div class="kv-row"><span class="kv-key">Currencies</span><div class="kv-value" id="config-currencies"></div></div>
          <div class="kv-row"><span class="kv-key">Opening balance</span><div class="kv-value kv-money" id="config-openings"></div></div>        </section>
        <section class="config-block" aria-labelledby="config-sections-title">
          <div class="config-block-head"><h3 id="config-sections-title">Sections</h3><select id="config-copy" class="filter-select" aria-label="Copy setup from another year"></select><button type="button" class="quiet-button" id="config-add-section"><i class="ti ti-plus" aria-hidden="true"></i> Add section</button></div>
          <div class="config-sections" id="config-sections"></div>
        </section>
      </div>
      <footer class="config-foot">
        <p class="settings-error" id="year-settings-error" role="alert" hidden></p>
        <span class="config-tip">Type and press <kbd>Enter</kbd> or <kbd>,</kbd> to add · paste a comma list · <kbd>⌫</kbd> removes the last</span>
        <button type="button" class="quiet-button" data-close-dialog>Cancel</button>
        <button type="submit" class="primary-button">Save</button>
      </footer>
    </form>
  </dialog>
  <dialog class="modal entry-modal" id="entry-modal" aria-labelledby="entry-modal-title">
    <form novalidate>
      <header class="entry-modal-head">
        <div><p class="entry-modal-path" id="entry-modal-path"></p><h2 id="entry-modal-title">Subsection</h2><p class="entry-modal-month" id="entry-modal-month"></p></div>
        <button type="button" class="icon-button" data-close-entry aria-label="Close"><i class="ti ti-x" aria-hidden="true"></i></button>
      </header>
      <div class="entry-modal-fields">
        <label class="field wide">Date<input name="date" type="date" required></label>
        <label class="field wide">Description<input name="description" maxlength="80" autocomplete="off" placeholder="What was it?"></label>
        <label class="field entry-amount">Amount<input name="amount" type="number" min="0" step="any" inputmode="decimal" placeholder="0"></label>
        <label class="field wide">Place (optional)<input name="place" maxlength="60" autocomplete="off" placeholder="Where?"></label>
      </div>
      <ol class="entry-modal-log" id="entry-modal-log" aria-label="Added just now"></ol>
      <footer class="entry-modal-foot">
        <label class="entry-again"><input type="checkbox" name="again"> Add another</label>
        <button type="button" class="quiet-button" data-close-entry>Cancel</button>
        <button type="submit" class="primary-button">Save</button>
      </footer>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
