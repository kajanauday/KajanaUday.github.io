<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121417">
  <script>
    // Apply the saved theme before anything paints, so the page never flashes the other one.
    try { if (localStorage.getItem('family-budget-theme') === 'light') { document.documentElement.dataset.theme = 'light'; document.querySelector('meta[name="theme-color"]').content = '#f6f3ec'; } } catch (error) { /* Dark by default. */ }
  </script>
  <title>Kajana Uday Expenses | Monthly ledger</title>
  <link rel="stylesheet" href="../family-budget.css?v=20261024c">
  <script src="../firebase-config.js?v=20261012a" defer></script>
  <script src="../firebase-auth.js?v=20261021k" defer></script>
  <script src="../offline-store.js?v=20261026c" defer></script>
  <script src="../data-layer.js?v=20261024b" defer></script>
  <script src="../ledger-search.js?v=20261023a" defer></script>
  <script src="../component-blueprints.js?v=20261024b" defer></script>
  <script src="../renderer-engine.js?v=20261025b" defer></script>
  <script src="../family-budget.js?v=20261024b" defer></script>
</head>
<body data-page="months">
  <header class="topbar ledger-topbar">
    <a class="brand" href="months.html" aria-label="Kajana Uday Expenses"><span class="brand-word">Kajana Uday <span>Expenses</span></span></a>
    <div></div>
    <div class="header-actions">
      <span class="save-state" role="status" data-state="saved" title="All changes saved"><span class="save-dot" aria-hidden="true"></span><span class="sr-only">All changes saved</span></span>
      <button type="button" class="icon-button" id="search-button" aria-label="Search entries" title="Search entries (/)" aria-keyshortcuts="/"><i class="ti ti-search" aria-hidden="true"></i></button>
      <button type="button" class="icon-button theme-button" id="theme-button" aria-label="Switch to light theme" title="Switch to light theme"><i class="ti ti-sun" aria-hidden="true"></i></button>
      <button type="button" class="primary-button add-entry-button" id="add-entry-button" title="Add an expense or income"><i class="ti ti-plus" aria-hidden="true"></i><span>Add</span></button>
      <button type="button" class="icon-button" id="logout-button" aria-label="Log out" title="Log out"><i class="ti ti-logout-2" aria-hidden="true"></i></button>
    </div>
  </header>
  <main class="ledger" id="ledger">
    <h1 class="sr-only">Monthly ledger</h1>
    <div class="year-bar">
      <div class="year-tabs" id="year-tabs" role="group" aria-label="Year"></div>
      <button type="button" class="quiet-button summary-toggle" data-toggle-universe aria-pressed="false" aria-controls="universe" title="Year summary"><i class="ti ti-chart-bar" aria-hidden="true"></i><span>Year summary</span></button>
    </div>
    <div class="universe" id="universe">
      <div class="universe-inner">
        <section class="year-kpis" id="year-kpis" aria-label="Year to date"></section>
      </div>
    </div>
    <div class="month-ledger" id="month-ledger"></div>
  </main>

  <dialog class="modal conflict-dialog" id="conflict-dialog" aria-labelledby="conflict-dialog-title">
    <div class="modal-header"><h2 id="conflict-dialog-title">Changed on another device</h2></div>
    <p class="conflict-what" id="conflict-what"></p>
    <ul class="conflict-paths" id="conflict-paths"></ul>
    <p class="conflict-when" id="conflict-when"></p>
    <div class="modal-actions"><button type="button" class="quiet-button" data-conflict="theirs">Use the other version</button><button type="button" class="primary-button" data-conflict="mine">Keep my offline changes</button></div>
  </dialog>

  <dialog class="modal move-dialog" id="move-dialog" aria-labelledby="move-dialog-title">
    <form id="move-form" novalidate>
      <div class="modal-header"><h2 id="move-dialog-title">Move entry</h2><button type="button" class="icon-button" data-close-dialog aria-label="Close"><i class="ti ti-x" aria-hidden="true"></i></button></div>
      <p class="move-what" id="move-what"></p>
      <div class="move-fields">
        <label class="field">Move to<select name="target" required></select></label>
        <label class="field">Date<input name="date" type="date" required></label>
        <label class="field move-sub">Subsection<select name="category" required></select></label>
      </div>
      <p class="move-hint" id="move-hint" aria-live="polite"></p>
      <div class="modal-actions"><button type="button" class="quiet-button" data-close-dialog>Cancel</button><button type="submit" class="primary-button"><i class="ti ti-arrows-move" aria-hidden="true"></i> Move</button></div>
    </form>
  </dialog>

  <dialog class="modal search-dialog" id="search-dialog" aria-label="Search entries">
    <div class="search-box">
      <i class="ti ti-search" aria-hidden="true"></i>
      <input id="search-input" type="search" placeholder="Search in Telugu or English" aria-label="Search" aria-controls="search-results" autocomplete="off" spellcheck="false" enterkeyhint="search">
      <div class="search-scope" role="group" aria-label="Where to search">
        <button type="button" data-search-scope="year" aria-pressed="true">This year</button>
        <button type="button" data-search-scope="all" aria-pressed="false">All years</button>
      </div>
      <button type="button" class="search-close" data-close-dialog aria-label="Close search" title="Close (Esc)"><i class="ti ti-x" aria-hidden="true"></i></button>
    </div>
    <div class="search-terms" id="search-terms" aria-live="polite"></div>
    <div class="search-results" id="search-results" role="listbox" aria-label="Results"></div>
  </dialog>

  <dialog class="modal config-dialog" id="year-settings-dialog" aria-labelledby="year-settings-title">
    <form id="year-settings-form" novalidate>
      <header class="config-head">
        <div class="modal-header"><div><p>Year settings</p><h2 id="year-settings-title">Year configuration</h2></div><button type="button" class="icon-button" data-close-dialog aria-label="Close"><i class="ti ti-x" aria-hidden="true"></i></button></div>
        <div class="config-years" id="config-years" role="group" aria-label="Year to configure"></div>
      </header>
      <div class="config-body">
        <section class="config-block" aria-labelledby="config-general-title">
          <div class="config-block-head"><h3 id="config-general-title">Currencies</h3></div>
          <div class="config-currency-rows" id="config-currencies"></div>
        </section>
        <section class="config-block" aria-labelledby="config-events-title">
          <div class="config-block-head"><h3 id="config-events-title">Special events</h3><button type="button" class="quiet-button config-add-event" id="config-add-event" aria-label="Add a special event" title="Add a special event"><i class="ti ti-plus" aria-hidden="true"></i></button></div>
          <div class="config-events" id="config-events"></div>
        </section>
      </div>
      <footer class="config-foot">
        <p class="settings-error" id="year-settings-error" role="alert" hidden></p>
        <button type="button" class="quiet-button" data-close-dialog>Cancel</button>
        <button type="submit" class="primary-button">Save</button>
      </footer>
    </form>
  </dialog>

  <dialog class="modal month-dialog setup-dialog" id="section-setup-dialog" aria-labelledby="section-setup-title">
    <form id="section-setup-form" novalidate>
      <div class="modal-header"><div><p id="section-setup-where">Section setup</p><h2 id="section-setup-title">Section</h2></div><button type="button" class="icon-button" data-close-dialog aria-label="Close"><i class="ti ti-x" aria-hidden="true"></i></button></div>
      <div class="setup-names" id="setup-names" aria-label="Subsections: click to put one in the equation"></div>
      <label class="setup-formula"><span>Equation <button type="button" class="link-button" data-reset-formula title="Back to all subsections added">all added</button></span><input id="setup-formula" autocomplete="off" spellcheck="false" placeholder="Uday + Sairam" aria-describedby="setup-preview"></label>
      <p class="setup-preview" id="setup-preview" aria-live="polite"></p>
      <div class="setup-sign" id="setup-section-rule"></div>
      <p class="settings-error" id="section-setup-error" role="alert" hidden></p>
      <div class="modal-actions"><button type="button" class="quiet-button" data-close-dialog>Cancel</button><button type="submit" class="primary-button">Save</button></div>
    </form>
  </dialog>
  <dialog class="modal month-dialog" id="month-settings-dialog" aria-labelledby="month-settings-title">
    <form id="month-settings-form" novalidate>
      <div class="modal-header"><div><p>Month settings</p><h2 id="month-settings-title">Month</h2></div><button type="button" class="icon-button" data-close-dialog aria-label="Close"><i class="ti ti-x" aria-hidden="true"></i></button></div>
      <div class="month-currency-rows" id="month-currency-rows"></div>
      <div class="month-sections" id="month-sections"></div>
      <p class="settings-error" id="month-settings-error" role="alert" hidden></p>
      <div class="modal-actions"><button type="button" class="quiet-button" data-close-dialog>Cancel</button><button type="submit" class="primary-button">Save</button></div>
    </form>
  </dialog>

  <dialog class="modal entry-dialog" id="entry-dialog" aria-labelledby="entry-dialog-title">
    <form id="entry-form" novalidate>
      <div class="modal-header"><h2 id="entry-dialog-title">Add an expense</h2><button type="button" class="icon-button" data-close-dialog aria-label="Close"><i class="ti ti-x" aria-hidden="true"></i></button></div>
      <div class="entry-grid">
        <div class="entry-top">
          <div class="choice-row is-compact" id="entry-type" role="group" aria-label="Type"><button type="button" data-value="income" aria-pressed="false" aria-label="Income" title="Income">I</button><button type="button" data-value="expense" aria-pressed="true" aria-label="Expense" title="Expense">E</button></div>
          <input name="date" id="entry-date" type="date" required aria-label="Date">
          <div class="choice-row is-compact" id="entry-currency" role="group" aria-label="Currency"></div>
        </div>
        <label class="field">Subsection<select name="category" id="entry-category" required></select></label>
        <label class="field">Description<input name="description" maxlength="80" autocomplete="off" required></label>
        <div class="entry-pair">
          <label class="field"><span>Comment <small>optional</small></span><input name="place" maxlength="60" autocomplete="off"></label>
          <label class="field"><span>Amount</span><input name="amount" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="450 or =210+178" required><small class="amount-preview" id="entry-amount-preview" aria-live="polite"></small></label>
        </div>
      </div>
      <p class="settings-error" id="entry-error" role="alert" hidden></p>
      <div class="modal-actions"><button type="button" class="quiet-button" data-close-dialog>Cancel</button><button type="submit" class="primary-button">Save entry</button></div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
