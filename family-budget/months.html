<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090a0f">
  <script>
    // Apply the saved theme before anything paints, so the page never flashes the other one.
    try { if (localStorage.getItem('family-budget-theme') === 'light') { document.documentElement.dataset.theme = 'light'; document.querySelector('meta[name="theme-color"]').content = '#f6f3ec'; } } catch (error) { /* Dark by default. */ }
  </script>
  <title>Expense Tracker | Monthly ledger</title>
  <link rel="stylesheet" href="../family-budget.css?v=20261016a">
  <script src="../firebase-config.js?v=20261012a" defer></script>
  <script src="../data-layer.js?v=20261016a" defer></script>
  <script src="../component-blueprints.js?v=20261016a" defer></script>
  <script src="../renderer-engine.js?v=20261016a" defer></script>
  <script src="../family-budget.js?v=20261016b" defer></script>
</head>
<body data-page="months">
  <header class="topbar ledger-topbar">
    <a class="brand" href="months.html" aria-label="Expense Tracker"><span class="brand-mark"><i class="ti ti-wallet" aria-hidden="true"></i></span><span class="brand-word">Expense Tracker</span></a>
    <div></div>
    <div class="header-actions">
      <span class="save-state"><span class="save-dot"></span> Saved</span>
      <button type="button" class="icon-button theme-button" id="theme-button" aria-label="Switch to light theme" title="Switch to light theme"><i class="ti ti-sun" aria-hidden="true"></i></button>
      <button type="button" class="primary-button add-entry-button" id="add-entry-button" title="Add an expense or income"><i class="ti ti-plus" aria-hidden="true"></i><span>Add</span></button>
      <button type="button" class="icon-button" id="logout-button" aria-label="Log out" title="Log out"><i class="ti ti-logout-2" aria-hidden="true"></i></button>
    </div>
  </header>
  <main class="ledger" id="ledger">
    <h1 class="sr-only">Monthly ledger</h1>
    <div class="year-bar">
      <div class="year-tabs" id="year-tabs" role="group" aria-label="Year"></div>
      <button type="button" class="quiet-button summary-toggle" data-toggle-universe aria-pressed="false" aria-controls="universe"><i class="ti ti-chart-bar" aria-hidden="true"></i><span>Year summary</span></button>
    </div>
    <div class="universe" id="universe">
      <div class="universe-inner">
        <section class="year-kpis" id="year-kpis" aria-label="Year to date"></section>
      </div>
    </div>
    <div class="month-ledger" id="month-ledger"></div>
  </main>

  <dialog class="modal config-dialog" id="year-settings-dialog" aria-labelledby="year-settings-title">
    <form id="year-settings-form" novalidate>
      <header class="config-head">
        <div class="modal-header"><div><p>Year settings</p><h2 id="year-settings-title">Year configuration</h2></div><button type="button" class="icon-button" data-close-dialog aria-label="Close"><i class="ti ti-x" aria-hidden="true"></i></button></div>
        <div class="config-years" id="config-years" role="group" aria-label="Year to configure"></div>
      </header>
      <div class="config-body">
        <section class="config-block" aria-labelledby="config-general-title">
          <div class="config-block-head"><h3 id="config-general-title">Currencies</h3></div>
          <div class="config-currency-rows" id="config-currencies"></div>
        </section>
        <section class="config-block" aria-labelledby="config-events-title">
          <div class="config-block-head"><h3 id="config-events-title">Special events</h3><button type="button" class="quiet-button config-add-event" id="config-add-event" aria-label="Add a special event" title="Add a special event"><i class="ti ti-plus" aria-hidden="true"></i></button></div>
          <div class="config-events" id="config-events"></div>
        </section>
      </div>
      <footer class="config-foot">
        <p class="settings-error" id="year-settings-error" role="alert" hidden></p>
        <button type="button" class="quiet-button" data-close-dialog>Cancel</button>
        <button type="submit" class="primary-button">Save</button>
      </footer>
    </form>
  </dialog>

  <dialog class="modal month-dialog" id="month-settings-dialog" aria-labelledby="month-settings-title">
    <form id="month-settings-form" novalidate>
      <div class="modal-header"><div><p>Month settings</p><h2 id="month-settings-title">Month</h2></div><button type="button" class="icon-button" data-close-dialog aria-label="Close"><i class="ti ti-x" aria-hidden="true"></i></button></div>
      <div class="month-currency-rows" id="month-currency-rows"></div>
      <div class="month-sections" id="month-sections"></div>
      <p class="settings-error" id="month-settings-error" role="alert" hidden></p>
      <div class="modal-actions"><button type="button" class="quiet-button" data-close-dialog>Cancel</button><button type="submit" class="primary-button">Save</button></div>
    </form>
  </dialog>

  <dialog class="modal entry-dialog" id="entry-dialog" aria-labelledby="entry-dialog-title">
    <form id="entry-form" novalidate>
      <div class="modal-header"><h2 id="entry-dialog-title">Add an expense</h2><button type="button" class="icon-button" data-close-dialog aria-label="Close"><i class="ti ti-x" aria-hidden="true"></i></button></div>
      <div class="entry-grid">
        <div class="entry-top">
          <div class="choice-row is-compact" id="entry-type" role="group" aria-label="Type"><button type="button" data-value="income" aria-pressed="false" aria-label="Income" title="Income">I</button><button type="button" data-value="expense" aria-pressed="true" aria-label="Expense" title="Expense">E</button></div>
          <input name="date" id="entry-date" type="date" required aria-label="Date">
          <div class="choice-row is-compact" id="entry-currency" role="group" aria-label="Currency"></div>
        </div>
        <label class="field">Subsection<select name="category" id="entry-category" required></select></label>
        <label class="field">Description<input name="description" maxlength="80" autocomplete="off" required></label>
        <div class="entry-pair">
          <label class="field"><span>Place <small>optional</small></span><input name="place" maxlength="60" autocomplete="off"></label>
          <label class="field"><span>Amount</span><input name="amount" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="450 or =210+178" required><small class="amount-preview" id="entry-amount-preview" aria-live="polite"></small></label>
        </div>
      </div>
      <p class="settings-error" id="entry-error" role="alert" hidden></p>
      <div class="modal-actions"><button type="button" class="quiet-button" data-close-dialog>Cancel</button><button type="submit" class="primary-button">Save entry</button></div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
